name: input-spike

# Spike only (29814): prove whether each hosted host can deliver an OS-level key into an owned
# terminal window, with no permission actuation and no runner configuration change. Workflow-only;
# it writes no run document, admits nothing and never touches a frozen suite.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS CGEvent into the owned Terminal window
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report the Accessibility grant, then post one key
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/input-spike"
          mkdir -p "$OUT"
          # LaunchServices opens the script in Terminal without an AppleEvent; a minimal AppleEvent
          # is probed separately so an Automation denial is named, not folded into the key result.
          cat > "$OUT/reader.sh" <<READER
          #!/bin/bash
          rm -f "$OUT/received.bin" "$OUT/partial.bin"
          printf '{"isTTY":%s,"tty":"%s"}\n' "$([ -t 0 ] && echo true || echo false)" "$(tty 2>/dev/null || echo none)" > "$OUT/reader.started"
          head -c 1 > "$OUT/partial.bin"
          mv "$OUT/partial.bin" "$OUT/received.bin"
          READER
          chmod +x "$OUT/reader.sh"
          # LaunchServices can run the document WITHOUT handing it the terminal's stdin — measured
          # isTTY=false — which makes its silence unreadable. A do-script in the front window runs
          # the same file as a command, so the reader holds the tty the key would arrive on.
          cat > "$OUT/open.applescript" <<APPLESCRIPT
          tell application "Terminal"
            activate
            do script "$OUT/reader.sh &"
          end tell
          APPLESCRIPT
          # The AppleEvent does not return while the reader waits on its tty, so launch it detached:
          # the terminal still runs the command, and the runner continues to the post.
          osascript "$OUT/open.applescript" &
          sleep 2
          ( osascript -e 'tell application "Terminal" to get version' > "$OUT/appleevent.txt" 2> "$OUT/appleevent.err" ) || true
          open -a Terminal
          sleep 1
          # A single post cannot separate "the tap swallowed it" from "the app did not read it":
          # retry across all three taps, one second apart, and stop the moment a byte arrives.
          attempts=0
          for attempt in 0 1 2 3 4 5; do
            attempts=$((attempt + 1))
            osascript -l JavaScript scripts/input-spike-macos.js "$attempt" >> "$OUT/attempts.jsonl" 2>> "$OUT/result.err" || true
            sleep 1
            if [ -f "$OUT/received.bin" ]; then break; fi
          done
          {
            echo "spike=macos"
            if [ -f "$OUT/received.bin" ]; then
              echo "delivered=true"
              echo "bytes=$(od -An -tx1 "$OUT/received.bin")"
            else
              echo "delivered=false"
            fi
            echo "appleevent=$(cat "$OUT/appleevent.txt" 2>/dev/null || true)"
            echo "appleevent_err=$(cat "$OUT/appleevent.err" 2>/dev/null || true)"
            echo "attempts=$attempts"
            cat "$OUT/attempts.jsonl" 2>/dev/null || true
            echo "reader=$(cat "$OUT/reader.started" 2>/dev/null || echo no-start-marker)"
            cat "$OUT/result.err" 2>/dev/null || true
          } | tee "$OUT/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-spike-macos
          path: ${{ runner.temp }}/input-spike

  windows:
    name: Windows SendInput into the owned Windows Terminal window
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Launch, focus, and send one key
        run: ./scripts/input-spike-windows.ps1 -Out "$env:RUNNER_TEMP/input-spike"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-spike-windows
          path: ${{ runner.temp }}/input-spike
