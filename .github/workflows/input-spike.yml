name: input-spike

# Spike only (29814): prove whether each hosted host can deliver an OS-level key into an owned
# terminal window, with no permission actuation and no runner configuration change. Workflow-only;
# it writes no run document, admits nothing and never touches a frozen suite.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS CGEvent into the owned Terminal window
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report the Accessibility grant, then post one key
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/input-spike"
          mkdir -p "$OUT"
          # LaunchServices opens the script in Terminal without an AppleEvent; a minimal AppleEvent
          # is probed separately so an Automation denial is named, not folded into the key result.
          cat > "$OUT/reader.sh" <<READER
          #!/bin/bash
          rm -f "$OUT/received.bin"
          head -c 1 > "$OUT/received.bin"
          READER
          chmod +x "$OUT/reader.sh"
          open -a Terminal "$OUT/reader.sh"
          sleep 3
          ( osascript -e 'tell application "Terminal" to get version' > "$OUT/appleevent.txt" 2> "$OUT/appleevent.err" ) || true
          open -a Terminal
          sleep 1
          osascript -l JavaScript scripts/input-spike-macos.js > "$OUT/result.json" 2> "$OUT/result.err" || true
          sleep 3
          {
            echo "spike=macos"
            if [ -f "$OUT/received.bin" ]; then
              echo "delivered=true"
              echo "bytes=$(od -An -tx1 "$OUT/received.bin")"
            else
              echo "delivered=false"
            fi
            echo "appleevent=$(cat "$OUT/appleevent.txt" 2>/dev/null || true)"
            echo "appleevent_err=$(cat "$OUT/appleevent.err" 2>/dev/null || true)"
            cat "$OUT/result.json" 2>/dev/null || true
            cat "$OUT/result.err" 2>/dev/null || true
          } | tee "$OUT/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-spike-macos
          path: ${{ runner.temp }}/input-spike

  windows:
    name: Windows SendInput into the owned Windows Terminal window
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Launch, focus, and send one key
        run: ./scripts/input-spike-windows.ps1 -Out "$env:RUNNER_TEMP/input-spike"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-spike-windows
          path: ${{ runner.temp }}/input-spike
