# Content Validation
#
# Main pushes run the unit suite only; weekly (Monday 09:00 UTC) and default manual runs
# keep content validation, site build and link checks. Manual unit_only runs support replay.
# Per-push Content Validation was retired on 2026-10-08. The unit-only trigger restores the
# missing component-test coverage measured in 28585 without reinstating those build steps.
# - Errors (exit code 1): workflow fails
# - Warnings: opens/updates a rolling GitHub issue with label "content-refresh"
#
# The "content-refresh" label should be created in the repo with:
#   description: "Automated content validation warnings from weekly CI"
#   color: "fbca04" (yellow)

name: Content Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Every Monday 9am UTC
  workflow_dispatch:
    inputs:
      unit_only:
        description: Run only the unit suite for cost and regression verification
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.unit_only) && 'unit' || 'validation' }}
  cancel-in-progress: true

jobs:
  unit:
    # The root CI reader excludes skipped jobs; keep this unit job running on every main push.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.unit_only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: ./.github/actions/source-siblings

      # Bootstrap Nix itself; a flake cannot supply the executable that evaluates it.
      # The identity suite hashes local source trees without a daemon or VM support.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_options: --no-daemon
          enable_kvm: false

      - name: Run unit tests
        run: bun --bun vitest run --maxWorkers 2

  validate:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.unit_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: ./.github/actions/source-siblings

      # Bootstrap Nix itself; a flake cannot supply the executable that evaluates it.
      # The identity suite hashes local source trees without a daemon or VM support.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_options: --no-daemon
          enable_kvm: false

      - name: Run validation
        id: validate
        run: |
          set -o pipefail
          bun scripts/validate.ts 2>&1 | tee /tmp/validate-output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/validate-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run unit tests
        run: bun --bun vitest run

      - name: Build site
        run: bun run build

      - name: Check for broken internal links
        run: bun scripts/check-404s.ts

      - name: Create or update issue
        if: steps.validate.outcome == 'failure' || contains(steps.validate.outputs.output, 'WARN')
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Content refresh: terminfo.dev';
            const output = process.env.VALIDATE_OUTPUT || '(no output captured)';
            const body = [
              '## Weekly Validation Report',
              '',
              `Run: ${new Date().toISOString()}`,
              `Trigger: \`${context.eventName}\``,
              '',
              '```',
              output,
              '```',
              '',
              '---',
              '*Auto-generated by [validate.yml](.github/workflows/validate.yml)*',
            ].join('\n');

            const { owner, repo } = context.repo;

            // Find existing open issue with the content-refresh label
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'content-refresh',
            });

            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['content-refresh'],
              });
              core.info(`Created issue #${created.data.number}`);
            }
        env:
          VALIDATE_OUTPUT: ${{ steps.validate.outputs.output }}

      - name: Fail on errors
        if: steps.validate.outcome == 'failure'
        run: exit 1
