name: macos-measurement
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure-macos:
    name: macOS iterm2 diagnostic
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the same cold-start app
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --cask iterm2
          test -d /Applications/iTerm.app
          sudo xattr -cr /Applications/iTerm.app
      - name: One bounded iTerm diagnostic (CTO 39838a35)
        timeout-minutes: 4
        shell: bash
        run: |
          bun - <<'TS'
          import { mkdir, writeFile, stat } from "node:fs/promises"
          import { join } from "node:path"
          import { writeFileSync } from "node:fs"

          // One diagnostic under CTO 39838a35. No collector, receipt, admission or retry.
          const out = join(process.env.RUNNER_TEMP!, "iterm-diagnostic")
          await mkdir(out, { recursive: true })
          const deadline = Date.now() + 210_000
          const bundle = "/Applications/iTerm.app"
          const plist = join(bundle, "Contents/Info.plist")
          const sentinel = join(out, "window-command-ran")
          const calls: Record<string, unknown>[] = []
          const evidence: Record<string, unknown> = {}
          const active = new Set<{ pid: number; kill: (signal: "SIGKILL") => void; exited: Promise<number> }>()
          const identity = Object.fromEntries([
            "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
            "RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
          ].map(key => [key, process.env[key] ?? null]))
          const parentTimer = setTimeout(async () => {
            const owned = [...active]
            for (const child of owned) child.kill("SIGKILL")
            await Promise.all(owned.map(child => child.exited))
            try {
              writeFileSync(join(out, "result.json"), JSON.stringify({ identity, calls, evidence, failure: "210-second parent deadline reached", terminatedAndReapedChildPids: owned.map(child => child.pid) }, null, 2))
            } finally { process.exit(124) }
          }, 210_000)
          await writeFile(join(out, "identity.json"), JSON.stringify({ parentPid: process.pid, bundle, identity }, null, 2))

          async function capture(stream: ReadableStream<Uint8Array>) {
            const chunks: Uint8Array[] = []
            let bytes = 0, kept = 0
            for await (const chunk of stream) {
              bytes += chunk.length
              const count = Math.min(chunk.length, 262_144 - kept)
              if (count > 0) { chunks.push(chunk.slice(0, count)); kept += count }
            }
            return { text: Buffer.concat(chunks).toString("utf8"), bytes, omittedBytes: bytes - kept }
          }

          async function run(label: string, argv: string[], wallMs: number, env = process.env) {
            const start = new Date(), remaining = deadline - Date.now()
            if (remaining <= 0) throw new Error(`Parent deadline spent before ${label}`)
            const bound = Math.min(wallMs, remaining)
            const child = Bun.spawn(argv, { stdout: "pipe", stderr: "pipe", env })
            active.add(child)
            let outerTimedOut = false
            const timer = setTimeout(() => { outerTimedOut = true; child.kill("SIGKILL") }, bound)
            try {
              const [exitCode, stdout, stderr] = await Promise.all([child.exited, capture(child.stdout), capture(child.stderr)])
              const end = new Date()
              const row = { label, argv, parentPid: process.pid, childPid: child.pid, start: start.toISOString(), end: end.toISOString(), elapsedMs: +end - +start, wallMs: bound, outerTimedOut, exitCode, stdout, stderr }
              calls.push(row)
              await writeFile(join(out, `${label}.json`), JSON.stringify(row, null, 2))
              return row
            } finally { clearTimeout(timer); active.delete(child) }
          }

          const ae = (body: string, seconds: number) => ["/usr/bin/osascript", "-e", `with timeout of ${seconds} seconds\n${body}\nend timeout`]
          // log(1) accepts whole seconds with an explicit offset. Retain exact call times
          // in each row; round the query outward by less than one second at each edge.
          const stamp = (iso: string, end = false) => new Date((end ? Math.ceil : Math.floor)(Date.parse(iso) / 1000) * 1000).toISOString().slice(0, 19).replace("T", " ") + "+0000"
          let control: Awaited<ReturnType<typeof run>> | undefined
          let itermPid: string | undefined
          let failure: unknown
          try {
            const id = await run("bundle-id", ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleIdentifier", plist], 5_000)
            await run("bundle-version", ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleShortVersionString", plist], 5_000)
            if (id.exitCode !== 0 || id.stdout.text.trim() !== "com.googlecode.iterm2") throw new Error("Installed bundle identity mismatch; see bundle-id.json")
            control = await run("positive-control", ae('tell application id "com.apple.finder" to get version', 5), 8_000)
            evidence.controlQualified = control.exitCode === 0 && !control.outerTimedOut && control.stdout.text.trim().length > 0
            await run("open-bundle", ["/usr/bin/open", bundle], 10_000)
            const pidDeadline = Math.min(deadline, Date.now() + 30_000)
            while (Date.now() < pidDeadline) {
              const pid = await run("process-observation", ["/usr/bin/pgrep", "-x", "iTerm2"], Math.min(2_000, Math.max(1, pidDeadline - Date.now())))
              if (pid.exitCode === 0 && /^\d+$/u.test(pid.stdout.text.trim())) { itermPid = pid.stdout.text.trim(); break }
              await Bun.sleep(Math.min(1000, Math.max(0, pidDeadline - Date.now())))
            }
            evidence.itermPid = itermPid ?? null
            let captured = false
            async function inspectStall(call: Awaited<ReturnType<typeof run>>) {
              if (captured || (call.exitCode === 0 && !call.outerTimedOut)) return
              captured = true
              // Query only these call intervals and these subsystems; never arbitrary logs.
              const predicate = 'subsystem == "com.apple.TCC" OR subsystem CONTAINS[c] "appleevent" OR process == "appleeventsd"'
              await run("screen", ["/usr/sbin/screencapture", "-x", join(out, "screen.png")], 10_000)
              const windows = await run("windows", ["/usr/bin/osascript", "-l", "JavaScript", "-e", `
                ObjC.import('CoreGraphics'); ObjC.import('Foundation');
                var raw = $.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly | $.kCGWindowListExcludeDesktopElements, $.kCGNullWindowID);
                if (!raw) throw new Error('CGWindowListCopyWindowInfo returned null');
                function value(dict, key) { var ref = dict.objectForKey(key); return ref ? ref.js : null; }
                var rows = [], count = $.CFArrayGetCount(raw);
                for (var i = 0; i < count; i++) {
                  var w = ObjC.castRefToObject($.CFArrayGetValueAtIndex(raw, i));
                  rows.push({ owner: value(w, 'kCGWindowOwnerName'), pid: value(w, 'kCGWindowOwnerPID'), layer: value(w, 'kCGWindowLayer') });
                }
                JSON.stringify({ windows: rows, desktopElementsExcluded: true, nonDesktopWindowObserved: rows.length > 0 });
              `], 10_000)
              evidence.windowCensusMeasured = false
              if (windows.exitCode === 0 && !windows.outerTimedOut) {
                try {
                  const census = JSON.parse(windows.stdout.text)
                  if (!Array.isArray(census.windows) || !census.windows.every((w: any) => (typeof w.owner === "string" || w.owner === null) && typeof w.pid === "number" && typeof w.layer === "number") || census.nonDesktopWindowObserved !== (census.windows.length > 0)) throw new Error("Invalid CoreGraphics census; see windows.json")
                  evidence.windowCensusMeasured = true
                  evidence.nonDesktopWindowObserved = census.nonDesktopWindowObserved
                  evidence.windowOwnerNamesUnavailable = census.windows.filter((w: any) => w.owner === null).length
                } catch (error) {
                  evidence.windowCensusError = String(error)
                  console.error("WINDOW CENSUS UNMEASURED; see windows.json", error)
                }
              }
              evidence.screenshotVisibility = "Requires human inspection; blank image cannot prove absence of a modal. Screen Recording permission was not changed."
              if (itermPid) await run("iterm-process", ["/bin/ps", "-p", itermPid, "-o", "pid=,ppid=,state=,comm="], 5_000)
              for (const interval of [call, ...(control && control.exitCode !== 0 ? [control] : [])]) {
                await run(`log-${interval.label}`, ["/usr/bin/log", "show", "--style", "json", "--start", stamp(interval.start), "--end", stamp(interval.end, true), "--predicate", predicate], 20_000, { ...process.env, TZ: "UTC" })
              }
            }
            const path = await run("application-path", ae('POSIX path of (path to application id "com.googlecode.iterm2")', 15), 20_000)
            await inspectStall(path)
            const version = await run("application-version", ae('tell application id "com.googlecode.iterm2" to get version', 15), 20_000)
            await inspectStall(version)
            const command = `/usr/bin/touch '${sentinel.replaceAll("'", "'\\''")}'`
            const window = await run("create-window", ae(`tell application id "com.googlecode.iterm2"\ncreate window with default profile command ${JSON.stringify(command)}\nend tell`, 15), 20_000)
            await inspectStall(window)
            const sentinelDeadline = Math.min(deadline, Date.now() + 5_000)
            evidence.sentinelObserved = false
            while (Date.now() < sentinelDeadline) {
              try {
                const sample = await stat(sentinel)
                evidence.sentinelObserved = true
                evidence.sentinelObservedAt = new Date().toISOString()
                evidence.sentinelMtime = sample.mtime.toISOString()
                break
              } catch (error) { if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error }
              await Bun.sleep(Math.min(250, Math.max(0, sentinelDeadline - Date.now())))
            }
          } catch (error) {
            failure = error instanceof Error ? { name: error.name, message: error.message, stack: error.stack } : String(error)
            console.error("DIAGNOSTIC INCOMPLETE", failure)
          } finally {
            clearTimeout(parentTimer)
            await writeFile(join(out, "result.json"), JSON.stringify({ identity, parentPid: process.pid, calls, evidence, failure: failure ?? null, conclusion: "One diagnostic only. Interpret native evidence; unknown requires CTO before another run. No correction or parent acceptance is asserted." }, null, 2))
          }
          if (failure) process.exitCode = 1

          TS
      - name: Preserve exact diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iterm2-diagnostic
          path: ${{ runner.temp }}/iterm-diagnostic
          if-no-files-found: error
