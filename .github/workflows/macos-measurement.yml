name: macos-measurement

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-macos:
    name: macOS ${{ matrix.id }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: terminal-app
            bundle: /System/Applications/Utilities/Terminal.app
          - id: iterm2
            bundle: /Applications/iTerm.app
          - id: ghostty
            bundle: /Applications/Ghostty.app
          - id: alacritty
            bundle: /Applications/Alacritty.app
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the pinned producer and sample at job start
        run: |
          set -euo pipefail
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          OUT="$RUNNER_TEMP/measurement-artifacts"
          # The ONE app-launch parser is fetched beside the two receipt files so the bootstrap
          # shares exactly the parser run-parser validates with; a second copy is the drift this
          # extraction exists to prevent (28216).
          mkdir -p "$APPARATUS/scripts" "$APPARATUS/packages/terminfo.dev/src" "$APPARATUS/packages/run-parser/src" "$OUT"
          for source in scripts/hosted-runner-receipt.ts packages/terminfo.dev/src/disposable-receipt.ts packages/run-parser/src/app-launch.ts; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              --output "$APPARATUS/$source" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA"
          done
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" start "$OUT/job-start.json"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build and install the current collector
        run: |
          set -euo pipefail
          bun install
          bun scripts/build-cli.ts
          npm install -g ./packages/terminfo.dev
          terminfo --version

      - name: Install this job's terminal
        env:
          APP_ID: ${{ matrix.id }}
          APP_BUNDLE: ${{ matrix.bundle }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          case "$APP_ID" in
            terminal-app) ;;
            iterm2) brew install --cask iterm2 ;;
            ghostty) brew install --cask ghostty ;;
            alacritty)
              curl --location --fail --silent --show-error \
                https://github.com/alacritty/alacritty/releases/download/v0.17.0/Alacritty-v0.17.0.dmg \
                --output "$RUNNER_TEMP/Alacritty.dmg"
              hdiutil attach "$RUNNER_TEMP/Alacritty.dmg" -mountpoint /Volumes/Alacritty
              cp -R /Volumes/Alacritty/Alacritty.app /Applications/
              hdiutil detach /Volumes/Alacritty
              ;;
            *) echo "Unknown Mac measurement app: $APP_ID" >&2; exit 1 ;;
          esac
          test -d "$APP_BUNDLE" || { echo "Required terminal bundle missing: $APP_BUNDLE" >&2; exit 1; }
          if [ "$APP_ID" != terminal-app ]; then sudo xattr -cr "$APP_BUNDLE"; fi

      - name: Launch, emit the receipt, and collect as the last mutating step
        id: collect
        env:
          APP_ID: ${{ matrix.id }}
          APP_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/measurement-artifacts"
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          COMMAND_PATH="$RUNNER_TEMP/collect.command"
          NODE_DIR="$(dirname "$(command -v node)")"
          COLLECTOR="$(command -v terminfo)"
          TARGET_VERSION_EXPORT=""
          if [ "$APP_ID" = alacritty ]; then
            bundle_status=0
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")" || bundle_status=$?
            printf 'Alacritty bundle version (raw): %s\n' "$bundle_version"
            test "$bundle_status" = 0 || { echo "Alacritty bundle version read failed ($bundle_status)" >&2; exit 1; }
            test -n "$bundle_version" || { echo "Alacritty bundle version is empty" >&2; exit 1; }
            binary_status=0
            binary_version="$("$APP_BUNDLE/Contents/MacOS/alacritty" --version)" || binary_status=$?
            printf 'Alacritty binary --version (raw): %s\n' "$binary_version"
            test "$binary_status" = 0 || { echo "Alacritty binary --version failed ($binary_status)" >&2; exit 1; }
            version_pattern='^alacritty[[:blank:]]+([^[:space:]]+)([[:blank:]]+\([^[:space:]]+\))?$'
            [[ "$binary_version" =~ $version_pattern ]] || { echo "Alacritty binary --version has an unexpected shape" >&2; exit 1; }
            test "${BASH_REMATCH[1]}" = "$bundle_version" || { echo "Alacritty bundle and binary versions disagree" >&2; exit 1; }
            TARGET_VERSION_EXPORT="$(printf 'export TERMINFO_TARGET_VERSION=%q' "$bundle_version")"
          fi
          cat > "$COMMAND_PATH" <<SCRIPT
          #!/bin/bash
          $TARGET_VERSION_EXPORT
          export PATH="$NODE_DIR:/usr/local/bin:/opt/homebrew/bin:\$PATH"
          export TERMINFO_DISPOSABLE_RECEIPT="$OUT/host-measured.json"
          attempts=0
          while [ ! -f "$OUT/collector-ready" ]; do
            attempts=\$((attempts + 1))
            if [ "\$attempts" -ge 180 ]; then echo "Receipt self-parse never succeeded; collection refused" >&2; exit 1; fi
            sleep 1
          done
          # The owned Darwin terminal arms read TERMINFO_RUN_ID and refuse an empty launch id
          # (owned-terminal.ts). The id only exists once the launched step emitted the receipt, so it is
          # read here, after the readiness wait and before the collector (27917: hosted runs never set it).
          TERMINFO_RUN_ID="\$(jq -er .runId "$OUT/host-measured.json")" || {
            echo "Receipt has no launch run ID; collection refused" >&2
            echo "Receipt has no launch run ID; collection refused" > "$OUT/collector.log"
            printf '1\n' > "$OUT/collector-exit"
            exit 1
          }
          export TERMINFO_RUN_ID
          "$COLLECTOR" test --output "$OUT/run.json" > "$OUT/collector.log" 2>&1
          status=\$?
          printf '%s\n' "\$status" > "$OUT/collector-exit"
          SCRIPT
          chmod +x "$COMMAND_PATH"
          case "$APP_ID" in
            terminal-app) open -a "$APP_BUNDLE" "$COMMAND_PATH" ;;
            iterm2)
              printf 'iterm_launch_start=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
              test -d "$APP_BUNDLE" || {
                echo "Required iTerm2 bundle missing: $APP_BUNDLE" >&2
                printf 'iterm_launch_end=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
                echo 'iterm_failure=true' >> "$GITHUB_OUTPUT"
                exit 1
              }
              printf -v launch_command '/bin/bash %q' "$COMMAND_PATH"
              if node - "$APP_BUNDLE" "--command=$launch_command" > "$OUT/launcher.log" 2>&1 <<'ITERM_STARTUP'
          const { spawnSync } = require('node:child_process');
          const [bundle, command] = process.argv.slice(2);
          const run = (name, file, args, timeout = 5000) => {
            const result = spawnSync(file, args, { encoding: 'utf8', timeout, killSignal: 'SIGKILL', maxBuffer: 262144 });
            process.stdout.write(JSON.stringify({ name, file, args, status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr, stdoutBytes: Buffer.byteLength(result.stdout || ''), stderrBytes: Buffer.byteLength(result.stderr || '') }) + '\n');
            if (result.error || result.signal) throw new Error(`iTerm2 ${name} failed: ${result.error?.message || result.signal}`);
            return result;
          };
          const plist = `${bundle}/Contents/Info.plist`;
          const id = run('bundle identifier', '/usr/libexec/PlistBuddy', ['-c', 'Print :CFBundleIdentifier', plist]);
          if (id.status !== 0 || id.stdout.trim() !== 'com.googlecode.iterm2') throw new Error('iTerm2 bundle identifier mismatch');
          const version = run('version', '/usr/libexec/PlistBuddy', ['-c', 'Print :CFBundleShortVersionString', plist]);
          if (version.status !== 0 || version.stdout.trim() !== '3.6.11') throw new Error('iTerm2 version must be 3.6.11; renewed qualification required');
          const existing = run('pgrep', '/usr/bin/pgrep', ['-x', 'iTerm2']);
          if (existing.status === 0) throw new Error('iTerm2 already running; refusing to attach');
          if (existing.status !== 1) throw new Error(`iTerm2 pgrep failed (${existing.status})`);
          const opened = run('open', '/usr/bin/open', ['-a', bundle, '--args', command], 10000);
          if (opened.status !== 0) throw new Error(`iTerm2 open failed (${opened.status})`);
          ITERM_STARTUP
              then
                printf 'iterm_launch_end=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
                cat "$OUT/launcher.log"
              else
                printf 'iterm_launch_end=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
                cat "$OUT/launcher.log" >&2
                echo 'iterm_failure=true' >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            ghostty)
              mkdir -p "$HOME/.config/ghostty"
              printf 'command = /bin/bash %s\n' "$COMMAND_PATH" > "$HOME/.config/ghostty/config"
              "$APP_BUNDLE/Contents/MacOS/ghostty" > "$OUT/launcher.log" 2>&1 &
              ;;
            alacritty)
              "$APP_BUNDLE/Contents/MacOS/alacritty" -e /bin/bash "$COMMAND_PATH" > "$OUT/launcher.log" 2>&1 &
              ;;
            *) echo "Unknown Mac collection app: $APP_ID" >&2; exit 1 ;;
          esac
          sleep 3
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" emit "$OUT/job-start.json" "$OUT/host-measured.json"
          # The receipt exists before strict parsing. Release collection ONLY after producer success.
          touch "$OUT/collector-ready"
          for attempt in {1..300}; do
            if [ -f "$OUT/collector-exit" ]; then
              status="$(cat "$OUT/collector-exit")"
              test "$status" = 0 || { echo "$APP_ID collector failed ($status); see collector.log artifact" >&2; exit 1; }
              test -s "$OUT/run.json" || { echo "$APP_ID collector returned no run.json" >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "$APP_ID collector did not finish within 300 seconds; see launcher/collector artifacts" >&2
          if [ "$APP_ID" = iterm2 ]; then echo 'iterm_failure=true' >> "$GITHUB_OUTPUT"; fi
          exit 1

      - name: Preserve iTerm launch failure evidence
        if: failure() && steps.collect.outputs.iterm_failure == 'true'
        env:
          ITERM_LAUNCH_START: ${{ steps.collect.outputs.iterm_launch_start }}
          ITERM_LAUNCH_END: ${{ steps.collect.outputs.iterm_launch_end }}
        run: |
          bun --eval '
          const { writeFile } = await import("node:fs/promises");
          const { join } = await import("node:path");
          const out = join(process.env.RUNNER_TEMP, "measurement-artifacts");
          // Bounded capture and CoreGraphics bridge from diagnostic59f65a57.
          async function capture(stream) {
            const chunks = []; let bytes = 0, kept = 0;
            for await (const chunk of stream) {
              bytes += chunk.length;
              const count = Math.min(chunk.length, 262144 - kept);
              if (count > 0) { chunks.push(chunk.slice(0, count)); kept += count; }
            }
            return { text: Buffer.concat(chunks).toString("utf8"), bytes, omittedBytes: bytes - kept };
          }
          async function run(label, argv, wallMs) {
            const start = new Date();
            const child = Bun.spawn(argv, { stdout: "pipe", stderr: "pipe", env: { ...process.env, TZ: "UTC" } });
            let outerTimedOut = false;
            const timer = setTimeout(() => { outerTimedOut = true; child.kill("SIGKILL"); }, wallMs);
            try {
              const [exitCode, stdout, stderr] = await Promise.all([child.exited, capture(child.stdout), capture(child.stderr)]);
              const row = { label, argv, childPid: child.pid, start: start.toISOString(), end: new Date().toISOString(), wallMs, outerTimedOut, exitCode, stdout, stderr };
              await writeFile(join(out, `iterm-${label}.json`), JSON.stringify(row, null, 2));
              if (exitCode !== 0 || outerTimedOut) console.error(`iTerm failure evidence ${label} unmeasured; see iterm-${label}.json`);
              return row;
            } finally { clearTimeout(timer); }
          }
          // date(1) outputs whole seconds; include the entire final launch second.
          const stamp = (iso, end = false) => new Date(Math.floor(Date.parse(iso) / 1000) * 1000 + (end ? 1000 : 0)).toISOString().slice(0, 19).replace("T", " ") + "+0000";
          const launchEnd = process.env.ITERM_LAUNCH_END;
          const failures = [];
          for (const [label, argv, bound] of [
            ["screen", ["/usr/sbin/screencapture", "-x", join(out, "iterm-screen.png")], 10000],
            ["windows", ["/usr/bin/osascript", "-l", "JavaScript", "-e", `
              ObjC.import("CoreGraphics"); ObjC.import("Foundation");
              var raw = $.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly | $.kCGWindowListExcludeDesktopElements, $.kCGNullWindowID);
              if (!raw) throw new Error("CGWindowListCopyWindowInfo returned null");
              function value(dict, key) { var ref = dict.objectForKey(key); return ref ? ref.js : null; }
              var rows = [], count = $.CFArrayGetCount(raw);
              for (var i = 0; i < count; i++) {
                var w = ObjC.castRefToObject($.CFArrayGetValueAtIndex(raw, i));
                rows.push({ owner: value(w, "kCGWindowOwnerName"), pid: value(w, "kCGWindowOwnerPID"), layer: value(w, "kCGWindowLayer") });
              }
              JSON.stringify({ windows: rows });
            `], 10000],
            ["log", ["/usr/bin/log", "show", "--style", "json", "--start", stamp(process.env.ITERM_LAUNCH_START), "--end", stamp(launchEnd, true), "--predicate", `subsystem == "com.apple.TCC" OR subsystem CONTAINS[c] "appleevent" OR process == "appleeventsd"`], 20000],
          ]) {
            try {
              const row = await run(label, argv, bound);
              if (row.exitCode !== 0 || row.outerTimedOut) throw new Error(`${label} capture failed`);
              if (label === "windows") {
                const census = JSON.parse(row.stdout.text);
                if (!Array.isArray(census.windows) || !census.windows.every(w => (typeof w.owner === "string" || w.owner === null) && typeof w.pid === "number" && typeof w.layer === "number")) throw new Error("Invalid CoreGraphics census");
              }
            } catch (error) { failures.push({ label, error: String(error) }); console.error("iTerm failure evidence incomplete", label, error); }
          }
          await writeFile(join(out, "iterm-failure-evidence.json"), JSON.stringify({ launchStart: process.env.ITERM_LAUNCH_START, launchEnd, failures }, null, 2));
          if (failures.length) process.exitCode = 1;
          '

      - name: Upload the receipt beside the exact collected run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-artifacts
          if-no-files-found: error
