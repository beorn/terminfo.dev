          }
          await writeFile(join(out, `${prefix}-failure-evidence.json`), JSON.stringify({ appId: process.env.APP_ID, childPid, launchStart, launchEnd, ...(additional ? { intervalSource: "collect-step-start-through-failure-evidence", editorLaunch, receiptRunId, appLaunch } : {}), screenContent: "unmeasured: inspect raw display for blank or desktop-only content; not owned-window proof", failures }, null, 2));
          if (failures.length && !terminal) process.exitCode = 1;
          '

      - name: Retain editor launch files and close only its owned GUI
        if: always() && (matrix.id == 'cursor' || matrix.id == 'com.microsoft.VSCode')
        run: |
          bun --eval "$(cat <<'HOSTED_EDITOR_CLOSE'
          const { existsSync, readFileSync, mkdirSync, copyFileSync } = require("node:fs");
          const { basename, join, dirname } = require("node:path");
          const { closeOwnedTerminalWindow } = require(process.cwd() + "/packages/terminfo.dev/src/terminal-app-window.ts");
          const out = join(process.env.RUNNER_TEMP, "measurement-artifacts");
          const installer = join(process.env.RUNNER_TEMP, "editor-installer.zip");
          if (existsSync(installer)) copyFileSync(installer, join(out, "editor-installer.zip"));
          const record = join(out, "editor-launch.json");
          if (!existsSync(record)) { console.log("No editor launch was created; nothing owned to close"); }
          else {
            const { appId, run, terminalWindow } = JSON.parse(readFileSync(record, "utf8"));
            try {
              const prefix = appId === "cursor" ? "cursor" : "vscode";
              // The script carries the run id (#30518 D2), so it is selected by the recorded name.
              const selected = new Set([basename(run.scriptPath), "owner-tty.txt", prefix + "-fixture/package.json", prefix + "-fixture/extension.cjs"]);
              for await (const path of new Bun.Glob("**/*.log").scan({ cwd: run.directory })) selected.add(path);
              for (const path of selected) {
                const source = join(run.directory, path);
                if (!existsSync(source)) { console.log("::warning::Editor retained launch file missing: " + source); continue; }
                const target = join(out, "editor-launch-files", path);
                mkdirSync(dirname(target), { recursive: true, mode: 0o700 });
                copyFileSync(source, target);
              }
            } finally {
              if (terminalWindow) closeOwnedTerminalWindow(terminalWindow);
              else console.error("Editor GUI ownership was not resolved; no process was signalled");
            }
          }
          HOSTED_EDITOR_CLOSE
          )"

      - name: Upload the receipt beside the exact collected run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-artifacts
          if-no-files-found: error
