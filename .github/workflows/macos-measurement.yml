name: macos-measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One authorized editor feasibility experiment. Never submit this reduced matrix to main.
jobs:
  measure-macos:
    name: Editor discriminator ${{ matrix.id }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cursor
            surface: Cursor classic workbench
            bundle: /Applications/Cursor.app
          - id: com.microsoft.VSCode
            surface: VS Code
            bundle: /Applications/Visual Studio Code.app
    env:
      APP_ID: ${{ matrix.id }}
      APP_SURFACE: ${{ matrix.surface }}
      APP_BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install existing source dependencies
        run: bun install --frozen-lockfile
      - name: Install the pinned editor artifact
        run: |
          bun --eval '
          import { createHash } from "node:crypto";
          import { mkdir, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          const out = join(process.env.RUNNER_TEMP, "editor-discriminator");
          await mkdir(out, { recursive: true });
          const arch = process.arch;
          const app = process.env.APP_ID;
          const artifacts = {
            cursor: {
              arm64: ["https://downloads.cursor.com/production/5d4df965746c5d09740842fc0f1331ba1c15783d/darwin/arm64/Cursor-darwin-arm64.zip", "03c6fb01e2200b17d2bf4259c7b66c08c9d505760d2a331e26ebfb3193bbf763"],
              x64: ["https://downloads.cursor.com/production/5d4df965746c5d09740842fc0f1331ba1c15783d/darwin/x64/Cursor-darwin-x64.zip", "3e867c8661113c415949da73d0bc0ed00f85f5b1863cab0c3d381c17d6aec59a"]
            },
            "com.microsoft.VSCode": {
              arm64: ["https://vscode.download.prss.microsoft.com/dbazure/download/stable/6d62b1d5dace93a33b3a6d3eca1317bd5e15bcb1/VSCode-darwin-arm64.zip", "099d3514fda308822a150d65ea36d4c4bfc565ee1b7fbc5a3fff97700f7af408"],
              x64: ["https://vscode.download.prss.microsoft.com/dbazure/download/stable/6d62b1d5dace93a33b3a6d3eca1317bd5e15bcb1/VSCode-darwin.zip", "cbe7bfbfe576f4315ffd5d4ac67c8dd550972659b7f1785999ed96505f25a31a"]
            }
          };
          const selected = artifacts[app]?.[arch];
          if (!selected) throw new Error("No reviewed editor artifact for " + app + "/" + arch);
          const [url, expected] = selected;
          const installer = join(out, "editor.zip");
          async function run(args) {
            const child = Bun.spawn(args, { stdout: "inherit", stderr: "inherit" });
            const status = await child.exited;
            if (status !== 0) throw new Error(args[0] + " exited " + status);
          }
          await run(["curl", "--fail", "--location", "--silent", "--show-error", "--connect-timeout", "15", "--max-time", "180", url, "--output", installer]);
          const actual = createHash("sha256").update(new Uint8Array(await Bun.file(installer).arrayBuffer())).digest("hex");
          await writeFile(join(out, "installer.json"), JSON.stringify({ app, surface: process.env.APP_SURFACE, arch, url, expectedSha256: expected, actualSha256: actual, sourceRevision: process.env.GITHUB_SHA, githubRunId: process.env.GITHUB_RUN_ID, githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT, runnerOS: process.env.RUNNER_OS, runnerArch: process.env.RUNNER_ARCH, runnerImage: process.env.ImageVersion }, null, 2));
          if (actual !== expected) throw new Error("Downloaded editor artifact digest differs; retained installer.json");
          await run(["ditto", "-x", "-k", installer, "/Applications"]);
          await run(["sudo", "xattr", "-cr", process.env.APP_BUNDLE]);
          const plist = join(process.env.APP_BUNDLE, "Contents", "Info.plist");
          const measured = Bun.spawnSync(["plutil", "-convert", "json", "-o", "-", plist]);
          if (measured.exitCode !== 0) throw new Error("Cannot measure installed editor Info.plist");
          await writeFile(join(out, "installed-info.json"), measured.stdout);
          '
      - name: Launch through the existing recipe and retain activation evidence
        run: |
          bun --eval '
          import { mkdir, readdir, copyFile, stat, writeFile } from "node:fs/promises";
          import { join, relative, dirname } from "node:path";
          const out = join(process.env.RUNNER_TEMP, "editor-discriminator");
          const prefix = process.env.APP_ID === "cursor" ? "cursor" : "vscode";
          const snapshots = join(out, "launch-snapshots");
          const observedRoots = new Set();
          const copied = new Map();
          let missingDuringStartup = 0;
          let observing = true;
          async function copy(path, root) {
            try {
              const info = await stat(path);
              if (copied.get(path) === info.mtimeMs) return;
              const destination = join(snapshots, root.split("/").pop(), relative(root, path));
              await mkdir(dirname(destination), { recursive: true });
              await copyFile(path, destination);
              copied.set(path, info.mtimeMs);
            } catch (error) {
              if (error.code !== "ENOENT") throw error;
              missingDuringStartup++;
            }
          }
          // Only this fresh jobs run-scoped launch directories, never an operator profile.
          // Snapshot while the collector runs: its existing successful cleanup removes the source.
          const observer = (async () => {
            while (observing) {
              for (const entry of await readdir("/tmp", { withFileTypes: true })) {
                if (!entry.isDirectory() || !entry.name.startsWith("terminfo-run-")) continue;
                const root = join("/tmp", entry.name);
                observedRoots.add(root);
                for (const file of ["serve.sh", "owner-tty.txt", prefix + "-fixture/package.json", prefix + "-fixture/extension.cjs"]) await copy(join(root, file), root);
                // The profile suffix is the random run id, not the temporary directory name.
                for (const child of await readdir(root, { withFileTypes: true }).catch(error => {
                  if (error.code !== "ENOENT") throw error;
                  missingDuringStartup++; return [];
                })) {
                  if (!child.isDirectory() || !child.name.startsWith(prefix + "-") || child.name === prefix + "-fixture" || child.name === prefix + "-extensions") continue;
                  const profileLogs = join(root, child.name, "logs");
                  try {
                    for await (const file of new Bun.Glob("**/*.log").scan({ cwd: profileLogs, absolute: true })) await copy(file, root);
                  } catch (error) {
                    if (error.code !== "ENOENT") throw error;
                    missingDuringStartup++;
                  }
                }
              }
              await Bun.sleep(100);
            }
          })();
          const env = { ...process.env };
          delete env.TERMINFO_DISPOSABLE_RECEIPT;
          delete env.TERMINFO_CAPTURE_DIRECTORY;
          const child = Bun.spawn(["bun", "packages/admin/src/index.ts", "probe", "app", process.env.APP_ID, "--force", "--output", join(out, "private-runs")], { env, stdout: Bun.file(join(out, "collector.log")), stderr: Bun.file(join(out, "collector.stderr")) });
          let status;
          try { status = await child.exited; } finally { observing = false; await observer; }
          await writeFile(join(out, "discriminator.json"), JSON.stringify({ app: process.env.APP_ID, surface: process.env.APP_SURFACE, sourceRevision: process.env.GITHUB_SHA, exitCode: status, observedRoots: [...observedRoots], copiedPaths: [...copied.keys()], missingDuringStartup, scope: "startup/fixture activation/terminal read only; no pixel qualification or admission", retained: "private-runs plus fixture, owner tty and extension-host/renderer log snapshots" }, null, 2));
          process.exitCode = status;
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-discriminator-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/editor-discriminator
          if-no-files-found: error
          retention-days: 14
