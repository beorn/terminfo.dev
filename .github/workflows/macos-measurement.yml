name: macos-measurement

on:
  workflow_dispatch:
    inputs:
      context_matrix:
        description: "Collection target rows; defaults to every hosted macOS terminal"
        type: string
        required: false
        default: >-
          {"include":[
            {"id":"terminal-app","bundle":"/System/Applications/Utilities/Terminal.app"},
            {"id":"iterm2","bundle":"/Applications/iTerm.app"},
            {"id":"ghostty","bundle":"/Applications/Ghostty.app"},
            {"id":"alacritty","bundle":"/Applications/Alacritty.app"},
            {"id":"wezterm","bundle":"/Applications/WezTerm.app"},
            {"id":"cursor","bundle":"/Applications/Cursor.app"},
            {"id":"com.microsoft.VSCode","bundle":"/Applications/Visual Studio Code.app"},
            {"id":"warp","bundle":"/Applications/Warp.app"},
            {"id":"cmux","bundle":"/Applications/cmux.app"}
          ]}
      probe_ids:
        description: "JSON probe IDs; null collects the full suite"
        type: string
        required: false
        default: "null"
      capture_run_ids:
        description: "Existing coordinator draft run IDs by matrix target; empty object for standalone collection"
        type: string
        required: false
        default: "{}"
      cohort:
        description: "Isolate this serial cohort dispatch from legacy workflow cancellation"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.cohort && format('-cohort-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  measure-macos:
    name: macOS ${{ matrix.id }}
    if: ${{ toJSON(fromJSON(inputs.context_matrix).include) != '[]' && toJSON(fromJSON(inputs.probe_ids)) != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.context_matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CAPTURE_RUN_IDS: ${{ inputs.capture_run_ids }}
      PROBE_IDS: ${{ inputs.probe_ids }}
    steps:
      - name: Bootstrap the pinned producer and sample at job start
        run: |
          set -euo pipefail
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          OUT="$RUNNER_TEMP/measurement-artifacts"
          # The ONE app-launch parser is fetched beside the two receipt files so the bootstrap
          # shares exactly the parser run-parser validates with; a second copy is the drift this
          # extraction exists to prevent (28216).
          mkdir -p "$APPARATUS/scripts" "$APPARATUS/packages/terminfo.dev/src" "$APPARATUS/packages/run-parser/src" "$OUT"
          for source in scripts/hosted-runner-receipt.ts packages/terminfo.dev/src/disposable-receipt.ts packages/run-parser/src/app-launch.ts; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              --output "$APPARATUS/$source" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA"
          done
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" start "$OUT/job-start.json"

      # Suite declaration checks HEAD against origin/main; retain full refs/history on hosted runners.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Build and retain the current collector
        run: |
          set -euo pipefail
          nice -n 10 bun install --frozen-lockfile
          nice -n 10 bun scripts/build-cli.ts
          nice -n 10 bun packages/terminfo.dev/bin/terminfo.mjs --version
          OUT="$RUNNER_TEMP/measurement-artifacts"
          cp bun.lock "$OUT/collector-bun.lock"
          cp packages/terminfo.dev/dist/terminfo.bundle.receipt.json "$OUT/collector-build.json"
          cp packages/terminfo.dev/dist/terminfo.bundle.mjs "$OUT/collector-bundle.mjs"

      - name: Install this job's terminal
        env:
          APP_ID: ${{ matrix.id }}
          APP_BUNDLE: ${{ matrix.bundle }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          ITERM_DOWNLOAD_URL: https://iterm2.com/downloads/stable/iTerm2-3_6_11.zip
          ITERM_DOWNLOAD_SHA256: 36e78c5049560eaa8e122224f6652eb4b229c61cd5e7332d6d25b5c36f7398e7
        run: |
          set -euo pipefail
          brew install imagemagick
          case "$APP_ID" in
            terminal-app) ;;
            iterm2)
              installer="$RUNNER_TEMP/iTerm2-3_6_11.zip"
              if ! curl --location --fail --silent --show-error \
                --retry 2 --retry-max-time 120 --connect-timeout 15 --max-time 120 \
                "$ITERM_DOWNLOAD_URL" --output "$installer"; then
                echo "Install this job's terminal: iTerm download failed; retained digest follows if bytes exist" >&2
                if [ -f "$installer" ]; then shasum -a 256 "$installer" >&2; else echo "No downloaded archive bytes to hash" >&2; fi
                exit 1
              fi
              if ! checksum="$(shasum -a 256 "$installer")"; then
                echo "Install this job's terminal: cannot hash the downloaded iTerm archive" >&2
                exit 1
              fi
              actual_sha256="${checksum%% *}"
              printf "Install this job's terminal: downloaded iTerm SHA-256 %s\n" "$actual_sha256"
              test "$actual_sha256" = "$ITERM_DOWNLOAD_SHA256" || {
                echo "Install this job's terminal: iTerm checksum mismatch (actual $actual_sha256, expected $ITERM_DOWNLOAD_SHA256)" >&2
                exit 1
              }
              if ! ditto -x -k "$installer" /Applications; then
                echo "Install this job's terminal: iTerm extraction failed (archive SHA-256 $actual_sha256)" >&2
                exit 1
              fi
              ;;
            ghostty) brew install --cask ghostty ;;
            wezterm) brew install --cask wezterm ;;
            cursor|com.microsoft.VSCode)
              bun --eval "$(cat <<'HOSTED_EDITOR_INSTALL'
          const { createHash } = require("node:crypto");
          const { writeFileSync } = require("node:fs");
          const app = process.env.APP_ID;
          const artifacts = {
            cursor: {
              arm64: ["https://downloads.cursor.com/production/5d4df965746c5d09740842fc0f1331ba1c15783d/darwin/arm64/Cursor-darwin-arm64.zip", "03c6fb01e2200b17d2bf4259c7b66c08c9d505760d2a331e26ebfb3193bbf763"],
              x64: ["https://downloads.cursor.com/production/5d4df965746c5d09740842fc0f1331ba1c15783d/darwin/x64/Cursor-darwin-x64.zip", "3e867c8661113c415949da73d0bc0ed00f85f5b1863cab0c3d381c17d6aec59a"]
            },
            "com.microsoft.VSCode": {
              arm64: ["https://vscode.download.prss.microsoft.com/dbazure/download/stable/6d62b1d5dace93a33b3a6d3eca1317bd5e15bcb1/VSCode-darwin-arm64.zip", "099d3514fda308822a150d65ea36d4c4bfc565ee1b7fbc5a3fff97700f7af408"],
              x64: ["https://vscode.download.prss.microsoft.com/dbazure/download/stable/6d62b1d5dace93a33b3a6d3eca1317bd5e15bcb1/VSCode-darwin.zip", "cbe7bfbfe576f4315ffd5d4ac67c8dd550972659b7f1785999ed96505f25a31a"]
            }
          };
          const selected = artifacts[app]?.[process.arch];
          if (!selected) throw new Error("No reviewed editor installer for " + app + "/" + process.arch);
          const [url, expectedSha256] = selected;
          const installer = process.env.RUNNER_TEMP + "/editor-installer.zip";
          const out = process.env.RUNNER_TEMP + "/measurement-artifacts";
          async function run(argv) {
            const result = Bun.spawn(argv, { stdout: "inherit", stderr: "inherit" });
            const status = await result.exited;
            if (status !== 0) throw new Error(argv[0] + " exited " + status);
          }
          await run(["curl", "--location", "--fail", "--silent", "--show-error", "--connect-timeout", "15", "--max-time", "180", url, "--output", installer]);
          const actualSha256 = createHash("sha256").update(new Uint8Array(await Bun.file(installer).arrayBuffer())).digest("hex");
          writeFileSync(out + "/editor-installer.json", JSON.stringify({ app, arch: process.arch, url, expectedSha256, actualSha256 }));
          if (actualSha256 !== expectedSha256) throw new Error("Editor installer checksum mismatch: expected " + expectedSha256 + ", actual " + actualSha256);
          await run(["ditto", "-x", "-k", installer, "/Applications"]);
          HOSTED_EDITOR_INSTALL
          )"
              cp "$RUNNER_TEMP/editor-installer.zip" "$RUNNER_TEMP/measurement-artifacts/editor-installer.zip"
              ;;
            alacritty|warp|cmux)
              bun --eval "$(cat <<'HOSTED_DMG_INSTALL'
          const { createHash } = require("node:crypto");
          const { writeFileSync, copyFileSync } = require("node:fs");
          const app = process.env.APP_ID;
          const name = app === "warp" ? "Warp" : app === "cmux" ? "cmux" : "Alacritty";
          const url = app === "warp"
            ? "https://releases.warp.dev/stable/v0.2026.10.14.08.27.stable_01/Warp.dmg"
            : app === "cmux"
              ? "https://github.com/manaflow-ai/cmux/releases/download/v0.65.2/cmux-macos.dmg"
              : "https://github.com/alacritty/alacritty/releases/download/v0.17.0/Alacritty-v0.17.0.dmg";
          const installer = process.env.RUNNER_TEMP + "/" + name + ".dmg";
          const mountpoint = "/Volumes/" + name;
          async function run(argv) {
            const child = Bun.spawn(argv, { stdout: "inherit", stderr: "inherit" });
            const status = await child.exited;
            if (status !== 0) throw new Error(argv[0] + " exited " + status);
          }
          await run(["curl", "--location", "--fail", "--silent", "--show-error", url, "--output", installer]);
          if (app === "warp" || app === "cmux") {
            const expectedSha256 = app === "warp"
              ? "866204c9583007b06c0e88e399fe57187150a9ab43ad4000c5935035794025c1"
              : "2f4bd98df7514067408d89398f8f19059015a3bbae632d0474515d4b76d6ee36";
            const actualSha256 = createHash("sha256").update(new Uint8Array(await Bun.file(installer).arrayBuffer())).digest("hex");
            const out = process.env.RUNNER_TEMP + "/measurement-artifacts";
            writeFileSync(out + "/" + app + "-installer.json", JSON.stringify({ app, url, expectedSha256, actualSha256 }));
            if (actualSha256 !== expectedSha256) throw new Error(name + " installer checksum mismatch: expected " + expectedSha256 + ", actual " + actualSha256);
            copyFileSync(installer, out + "/" + name + ".dmg");
          }
          await run(["hdiutil", "attach", installer, "-mountpoint", mountpoint]);
          await run(["cp", "-R", mountpoint + "/" + name + ".app", "/Applications/"]);
          await run(["hdiutil", "detach", mountpoint]);
          HOSTED_DMG_INSTALL
          )"
              ;;
            *) echo "Unknown Mac measurement app: $APP_ID" >&2; exit 1 ;;
          esac
          test -d "$APP_BUNDLE" || { echo "Required terminal bundle missing: $APP_BUNDLE" >&2; exit 1; }
          if [ "$APP_ID" != terminal-app ]; then sudo xattr -cr "$APP_BUNDLE"; fi

      # Ghostty, Alacritty, WezTerm and Warp are spawned from this shell, so the agent stays their
      # TCC responsible process. Terminal.app needs its own explicit grant: run 41806285584 retained
      # its Screen Recording prompt despite the image's expected grant. iTerm2 and cmux open through
      # LaunchServices and the two editors answer TCC as themselves (run 39701460666 TCC log).
      # Grant these apps using the existing access row in both TCC databases and replayd approval.
      - name: Grant Screen Recording to apps that are their own responsible process
        if: matrix.id == 'terminal-app' || matrix.id == 'iterm2' || matrix.id == 'cmux' || matrix.id == 'cursor' || matrix.id == 'com.microsoft.VSCode'
        env:
          APP_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          plist="$APP_BUNDLE/Contents/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          executable="$APP_BUNDLE/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          requirement="$(codesign --display -r- "$APP_BUNDLE" | sed -n 's/^designated => //p')"
          test -n "$requirement" || { echo "Screen Recording grant: $APP_BUNDLE has no designated requirement" >&2; exit 1; }
          printf '%s\n' "$requirement" | csreq -r- -b "$RUNNER_TEMP/screen-capture.csreq"
          csreq_hex="$(xxd -p "$RUNNER_TEMP/screen-capture.csreq" | tr -d '\n')"
          now="$(date +%s)"
          row="'kTCCServiceScreenCapture','$bundle_id',0,2,4,1,X'$csreq_hex',NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now"
          grant() {
            local db="${*: -1}"
            "$@" "INSERT OR REPLACE INTO access VALUES($row);"
            granted="$("$@" "SELECT auth_value FROM access WHERE service='kTCCServiceScreenCapture' AND client='$bundle_id';")"
            test "$granted" = 2 || { echo "Screen Recording grant for $bundle_id did not read back from $db (got '$granted')" >&2; exit 1; }
            printf 'Screen Recording granted to %s in %s\n' "$bundle_id" "$db"
          }
          grant sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db"
          grant sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          approvals="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          mkdir -p "$(dirname "$approvals")"
          defaults write "$approvals" "$executable" -date "3024-01-01 00:00:00 +0000"
          defaults read "$approvals" "$executable"

      - name: Launch, emit the receipt, and collect as the last mutating step
        id: collect
        env:
          APP_ID: ${{ matrix.id }}
          APP_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/measurement-artifacts"
          mkdir -p "$OUT/artifacts"
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          COMMAND_PATH="$RUNNER_TEMP/collect.command"
          CAPTURE_RUN_ID=""
          if [[ -n "$CAPTURE_RUN_IDS" ]]; then CAPTURE_RUN_ID="$(jq -r --arg id "$APP_ID" '.[$id] // ""' <<< "$CAPTURE_RUN_IDS")"; fi
          [[ -z "$CAPTURE_RUN_ID" || "$CAPTURE_RUN_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "Invalid delegated capture run ID" >&2; exit 1; }
          NODE_DIR="$(dirname "$(command -v node)")"
          COLLECTOR="$GITHUB_WORKSPACE/packages/terminfo.dev/bin/terminfo.mjs"
          COLLECTOR_BUN="$(command -v bun)"

          # Temporary qualification task revision: never merge this entry into main.
          QUALIFICATION_OUT="$OUT" QUALIFICATION_SOURCE_ROOT="$GITHUB_WORKSPACE" "$COLLECTOR_BUN" --no-env-file --eval '
          const { readFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const hash = bytes => createHash("sha256").update(bytes).digest("hex");
          const out = process.env.QUALIFICATION_OUT, sourceRoot = process.env.QUALIFICATION_SOURCE_ROOT;
          if (!out || !sourceRoot) throw new Error("Existing artifact/source paths are missing");
          const payload = Buffer.from("", "base64");
          if (hash(payload) !== "6d0e7e1ef1cac31f0ebfd3050a52d44d4c3bc4a71f27a3a7eda1da9fe2db3e93") throw new Error("Staged payload differs from static GO");
          const sourceRevision = execFileSync("git", ["-C", sourceRoot, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const companionBundle = join(sourceRoot, "packages/terminfo.dev/dist/terminfo.bundle.mjs");
          const companionReceipt = join(sourceRoot, "packages/terminfo.dev/dist/terminfo.bundle.receipt.json");
          const receiptBytes = readFileSync(companionReceipt), receipt = JSON.parse(receiptBytes.toString("utf8"));
          const companionBundleSha256 = hash(readFileSync(companionBundle));
          if (receipt.collectorRevision !== sourceRevision || receipt.bundleSha256 !== companionBundleSha256) throw new Error("Existing build receipt does not bind this source/bundle");
          writeFileSync(join(out, "source-entry-payload.ts"), payload, { flag: "wx", mode: 0o600 });
          writeFileSync(join(out, "source-entry-input.json"), JSON.stringify({ sourceRoot, sourceRevision, evidenceDirectory: join(out, "source-entry-qualification"), companionBundle, companionReceipt, companionBundleSha256, companionReceiptSha256: hash(receiptBytes) }, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          '
          printf 'collect_started_at=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          BUN_DIR="$(dirname "$COLLECTOR_BUN")"
          TARGET_VERSION_EXPORT=""
          if [ "$APP_ID" = alacritty ]; then
            bundle_status=0
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")" || bundle_status=$?
            printf 'Alacritty bundle version (raw): %s\n' "$bundle_version"
            test "$bundle_status" = 0 || { echo "Alacritty bundle version read failed ($bundle_status)" >&2; exit 1; }
            test -n "$bundle_version" || { echo "Alacritty bundle version is empty" >&2; exit 1; }
            binary_status=0
            binary_version="$("$APP_BUNDLE/Contents/MacOS/alacritty" --version)" || binary_status=$?
            printf 'Alacritty binary --version (raw): %s\n' "$binary_version"
            test "$binary_status" = 0 || { echo "Alacritty binary --version failed ($binary_status)" >&2; exit 1; }
            version_pattern='^alacritty[[:blank:]]+([^[:space:]]+)([[:blank:]]+\([^[:space:]]+\))?$'
            [[ "$binary_version" =~ $version_pattern ]] || { echo "Alacritty binary --version has an unexpected shape" >&2; exit 1; }
            test "${BASH_REMATCH[1]}" = "$bundle_version" || { echo "Alacritty bundle and binary versions disagree" >&2; exit 1; }
            TARGET_VERSION_EXPORT="$(printf 'export TERMINFO_TARGET_VERSION=%q' "$bundle_version")"
          elif [ "$APP_ID" = cursor ] || [ "$APP_ID" = com.microsoft.VSCode ] || [ "$APP_ID" = cmux ]; then
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")"
            test -n "$bundle_version" || { echo "$APP_ID bundle version is empty" >&2; exit 1; }
            TARGET_VERSION_EXPORT="$(printf 'export TERMINFO_TARGET_VERSION=%q' "$bundle_version")"
          fi
          PROBE_IDS_ARGS=""
          if [[ "$PROBE_IDS" != null ]]; then PROBE_IDS_ARGS="$(printf ' --probe-ids %q' "$PROBE_IDS")"; fi
          cat > "$COMMAND_PATH" <<SCRIPT
          #!/bin/bash
          $TARGET_VERSION_EXPORT
          export PATH="$BUN_DIR:$NODE_DIR:/usr/local/bin:/opt/homebrew/bin:\$PATH"
          export TERMINFO_DISPOSABLE_RECEIPT="$OUT/host-measured.json"
          export TERMINFO_CAPTURE_DIRECTORY="$OUT/artifacts"
          export TERMINFO_CAPTURE_RUN_ID="$CAPTURE_RUN_ID"
          printf 'phase=entry utc=%s pid=%s tty=%s\n' "\$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "\$\$" "\$(tty)" >> "$OUT/collector.log"
          exec 2>> "$OUT/collector.log"
          attempts=0
          while [ ! -f "$OUT/collector-ready" ]; do
            attempts=\$((attempts + 1))
            if [ "\$attempts" -ge 180 ]; then echo "Receipt self-parse never succeeded; collection refused" >&2; exit 1; fi
            sleep 1
          done
          printf 'phase=receipt-ready\n' >&2
          # Parse receipt custody even when the editor already supplied a clean launch identity.
          # The receipt identifies this hosted job; the matching inherited pair identifies its child.
          hosted_run_id="\$(jq -er .runId "$OUT/host-measured.json")" || {
            echo "Receipt has no launch run ID; collection refused" >&2
            printf '1\n' > "$OUT/collector-exit"
            exit 1
          }
          if [ -z "\${TERMINFO_TERM_FEATURES_LAUNCH:-}" ] || [ "\$TERMINFO_TERM_FEATURES_LAUNCH" != "\${TERMINFO_RUN_ID:-}" ]; then
            TERMINFO_RUN_ID="\$hosted_run_id"
          fi
          export TERMINFO_RUN_ID
          printf 'phase=run-id-parsed\n' >&2
          # stdout MUST stay on this terminal: the collector writes every probe query to
          # process.stdout, and the owned-terminal arm binds fd0, stdout and the controlling tty as
          # one PTY. Redirecting stdout to the log made that binding impossible and failed every
          # hosted macOS job at collect (27917; cause b7580050 / 28533). Only stderr is logged.
          printf 'phase=collector-invoked\n' >&2
          nice -n 10 "$COLLECTOR_BUN" --no-env-file "$OUT/source-entry-payload.ts" "$OUT/source-entry-input.json" 2>> "$OUT/collector.log"
          status=\$?
          printf 'phase=collector-exited status=%s\n' "\$status" >&2
          printf '%s\n' "\$status" > "$OUT/collector-exit"
          SCRIPT
          chmod +x "$COMMAND_PATH"
          case "$APP_ID" in
            terminal-app) open -a "$APP_BUNDLE" "$COMMAND_PATH" ;;
            iterm2)
              printf 'iterm_launch_start=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
              test -d "$APP_BUNDLE" || {
                echo "Required iTerm2 bundle missing: $APP_BUNDLE" >&2
                printf 'iterm_launch_end=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
                echo 'iterm_failure=true' >> "$GITHUB_OUTPUT"
                exit 1
              }
              printf -v launch_command '/bin/bash %q' "$COMMAND_PATH"
              if node - "$APP_BUNDLE" "--command=$launch_command" > "$OUT/launcher.log" 2>&1 <<'ITERM_STARTUP'
          const { spawnSync } = require('node:child_process');
          const [bundle, command] = process.argv.slice(2);
          const run = (name, file, args, timeout = 5000) => {
            const result = spawnSync(file, args, { encoding: 'utf8', timeout, killSignal: 'SIGKILL', maxBuffer: 262144 });
            process.stdout.write(JSON.stringify({ name, file, args, status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr, stdoutBytes: Buffer.byteLength(result.stdout || ''), stderrBytes: Buffer.byteLength(result.stderr || '') }) + '\n');
            if (result.error || result.signal) throw new Error(`iTerm2 ${name} failed: ${result.error?.message || result.signal}`);
            return result;
          };
          const plist = `${bundle}/Contents/Info.plist`;
          const id = run('bundle identifier', '/usr/libexec/PlistBuddy', ['-c', 'Print :CFBundleIdentifier', plist]);
          if (id.status !== 0 || id.stdout.trim() !== 'com.googlecode.iterm2') throw new Error('iTerm2 bundle identifier mismatch');
          const version = run('version', '/usr/libexec/PlistBuddy', ['-c', 'Print :CFBundleShortVersionString', plist]);
          if (version.status !== 0 || version.stdout.trim() !== '3.6.11') throw new Error('iTerm2 version must be 3.6.11; renewed qualification required');
          const existing = run('pgrep', '/usr/bin/pgrep', ['-x', 'iTerm2']);
          if (existing.status === 0) throw new Error('iTerm2 already running; refusing to attach');
          if (existing.status !== 1) throw new Error(`iTerm2 pgrep failed (${existing.status})`);
          const api = run('API server policy', '/usr/bin/defaults', ['write', 'com.googlecode.iterm2', 'EnableAPIServer', '-bool', 'true']);
          if (api.status !== 0) throw new Error(`iTerm2 API server policy failed (${api.status})`);
          const apiReadback = run('API server readback', '/usr/bin/defaults', ['read', 'com.googlecode.iterm2', 'EnableAPIServer']);
          if (apiReadback.status !== 0 || apiReadback.stdout.trim() !== '1') throw new Error('iTerm2 API server preference readback failed');
          // Set the fresh runner's preference before launch: iTerm treats trailing YES as a file to run.
          const policy = run('startup policy', '/usr/bin/defaults', ['write', 'com.googlecode.iterm2', 'OpenNoWindowsAtStartup', '-bool', 'true']);
          if (policy.status !== 0) throw new Error(`iTerm2 startup policy failed (${policy.status})`);
          // This job measures an explicitly consented transfer/display policy, not user defaults.
          // Both settings and their outcomes remain in the retained launcher.log.
          const consent = run('transfer consent policy', '/usr/bin/defaults', ['write', 'com.googlecode.iterm2', 'NoSyncSuppressDownloadConfirmation', '-bool', 'true']);
          if (consent.status !== 0) throw new Error(`iTerm2 transfer consent policy failed (${consent.status})`);
          const selection = run('transfer consent selection', '/usr/bin/defaults', ['write', 'com.googlecode.iterm2', 'NoSyncSuppressDownloadConfirmation_selection', '-int', '0']);
