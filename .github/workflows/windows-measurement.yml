name: windows-measurement

on:
  workflow_dispatch:
  push:
    branches:
      - task/27931-windows-terminal-workflow

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-windows:
    name: Windows ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-terminal
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the pinned producer and sample at job start
        run: |
          set -euo pipefail
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          OUT="$RUNNER_TEMP/measurement-artifacts"
          mkdir -p "$APPARATUS/scripts" "$APPARATUS/packages/terminfo.dev/src" "$OUT"
          for source in scripts/hosted-runner-receipt.ts packages/terminfo.dev/src/disposable-receipt.ts; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              --output "$APPARATUS/$source" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA"
          done
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" start "$OUT/job-start.json"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build and install the current collector
        run: |
          set -euo pipefail
          bun install
          bun scripts/build-cli.ts
          npm install -g ./packages/terminfo.dev
          terminfo --version

      - name: Install this job's terminal
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          case "$APP_ID" in
            windows-terminal)
              WT_DIR="C:/WindowsTerminal"
              if [ ! -f "$WT_DIR/wt.exe" ]; then
                curl -L -s -f "https://github.com/microsoft/terminal/releases/download/v1.21.2361.0/Microsoft.WindowsTerminal_1.21.2361.0_x64.zip" -o "$RUNNER_TEMP/wt.zip"
                powershell -NoProfile -Command "Expand-Archive -Path '$env:RUNNER_TEMP\\wt.zip' -DestinationPath '$WT_DIR' -Force"
              fi
              test -f "$WT_DIR/wt.exe" || { echo "Windows Terminal binary missing at $WT_DIR/wt.exe" >&2; exit 1; }
              ;;
            *) echo "Unknown Windows measurement app: $APP_ID" >&2; exit 1 ;;
          esac

      - name: Launch, emit the receipt, and collect as the last mutating step
        id: collect
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/measurement-artifacts"
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          COMMAND_PATH="$RUNNER_TEMP/collect.bat"
          COLLECTOR="$(command -v terminfo)"

          WIN_OUT="$(powershell -NoProfile -Command "[System.IO.Path]::GetFullPath('$OUT')")"
          WIN_COLLECTOR="$(powershell -NoProfile -Command "[System.IO.Path]::GetFullPath('$COLLECTOR')")"

          cat > "$COMMAND_PATH" <<BATCH
          @echo off
          set "TERMINFO_DISPOSABLE_RECEIPT=$WIN_OUT\\host-measured.json"
          :wait_loop
          if not exist "$WIN_OUT\\collector-ready" (
            powershell -NoProfile -Command "Start-Sleep -Milliseconds 500"
            goto wait_loop
          )
          call "$WIN_COLLECTOR" test --output "$WIN_OUT\\run.json" > "$WIN_OUT\\collector.log" 2>&1
          echo %ERRORLEVEL% > "$WIN_OUT\\collector-exit"
          exit /b %ERRORLEVEL%
          BATCH

          case "$APP_ID" in
            windows-terminal)
              C:/WindowsTerminal/wt.exe -d . cmd.exe /c "$COMMAND_PATH" &
              ;;
            *) echo "Unknown Windows collection app: $APP_ID" >&2; exit 1 ;;
          esac

          sleep 3
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" emit "$OUT/job-start.json" "$OUT/host-measured.json"
          touch "$OUT/collector-ready"

          for attempt in {1..300}; do
            if [ -f "$OUT/collector-exit" ]; then
              status="$(cat "$OUT/collector-exit" | tr -d '\r\n ')"
              test "$status" = 0 || { echo "$APP_ID collector failed ($status); see collector.log artifact" >&2; exit 1; }
              test -s "$OUT/run.json" || { echo "$APP_ID collector returned no run.json" >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "$APP_ID collector did not finish within 300 seconds; see launcher/collector artifacts" >&2
          exit 1

      - name: Upload the receipt beside the exact collected run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-artifacts
          if-no-files-found: error
