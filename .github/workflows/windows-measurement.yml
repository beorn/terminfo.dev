            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const runnerName = process.env.RUNNER_NAME;
            const apiUrl = process.env.GITHUB_API_URL || "https://api.github.com";
            const token = process.env.GH_TOKEN;

            if (!repo || !runId || !runnerName || !token) {
              return { matchCount: null, id: null };
            }

            try {
              const url = attempt
                ? `${apiUrl}/repos/${repo}/actions/runs/${runId}/attempts/${attempt}/jobs`
                : `${apiUrl}/repos/${repo}/actions/runs/${runId}/jobs`;
              const res = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                },
              });
              if (!res.ok) {
                return { matchCount: null, id: null };
              }
              const data = await res.json();
              const jobs = Array.isArray(data.jobs) ? data.jobs : [];
              const matched = jobs.filter((j) => j.runner_name === runnerName);
              return {
                matchCount: matched.length,
                id: matched.length === 1 && typeof matched[0].id === "number" ? matched[0].id : null,
              };
            } catch {
              return { matchCount: null, id: null };
            }
          }

          function sampleMachineGuid() {
            try {
              const res = spawnSync("reg.exe", ["query", "HKLM\\SOFTWARE\\Microsoft\\Cryptography", "/v", "MachineGuid", "/reg:64"], { encoding: "utf8" });
              if (res.status !== 0 || !res.stdout) return { available: false, sha256: null, byteLength: 0 };
              const m = res.stdout.match(/MachineGuid\s+REG_SZ\s+([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})/i);
              if (!m) return { available: false, sha256: null, byteLength: 0 };
              const val = m[1];
              if (/^[0f-]+$/i.test(val)) return { available: false, sha256: null, byteLength: 0 };
              return {
                available: true,
                sha256: createHash("sha256").update(val).digest("hex"),
