              };
            } catch {
              return { available: false, sha256: null, byteLength: 0 };
            }
          }

          function sampleNicMac() {
            try {
              const res = spawnSync("powershell.exe", ["-NoProfile", "-Command", "Get-NetAdapter -Physical | Where-Object { $_.Status -eq '\''Up'\'' } | Sort-Object ifIndex | Select-Object -First 1 -ExpandProperty MacAddress"], { encoding: "utf8" });
              if (res.status !== 0 || !res.stdout) return { available: false, sha256: null, byteLength: 0 };
              const val = res.stdout.trim();
              if (!/^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/.test(val)) return { available: false, sha256: null, byteLength: 0 };
              return {
                available: true,
                sha256: createHash("sha256").update(val).digest("hex"),
                byteLength: Buffer.byteLength(val),
              };
            } catch {
              return { available: false, sha256: null, byteLength: 0 };
            }
          }

          function sampleProductUuid() {
            try {
              const res = spawnSync("powershell.exe", ["-NoProfile", "-Command", "(Get-CimInstance Win32_ComputerSystemProduct).UUID"], { encoding: "utf8" });
              if (res.status !== 0 || !res.stdout) return { available: false, sha256: null, byteLength: 0 };
              const val = res.stdout.trim();
              if (!/^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$/.test(val)) return { available: false, sha256: null, byteLength: 0 };
              if (/^[0f-]+$/i.test(val)) return { available: false, sha256: null, byteLength: 0 };
              return {
                available: true,
                sha256: createHash("sha256").update(val).digest("hex"),
