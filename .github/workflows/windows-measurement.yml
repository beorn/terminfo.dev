name: windows-measurement

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-windows:
    name: Windows ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-terminal
          - id: alacritty
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the pinned producer and sample at job start
        run: |
          set -euo pipefail
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          OUT="$RUNNER_TEMP/measurement-artifacts"
          # The ONE app-launch parser is fetched beside the two receipt files so the bootstrap
          # shares exactly the parser run-parser validates with; a second copy is the drift this
          # extraction exists to prevent (28216).
          mkdir -p "$APPARATUS/scripts" "$APPARATUS/packages/terminfo.dev/src" "$APPARATUS/packages/run-parser/src" "$OUT"
          for source in scripts/hosted-runner-receipt.ts packages/terminfo.dev/src/disposable-receipt.ts packages/run-parser/src/app-launch.ts; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              --output "$APPARATUS/$source" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA"
          done
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" start "$OUT/job-start.json"

      - name: Configure git to preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Build and retain the current collector
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun scripts/build-cli.ts
          bun packages/terminfo.dev/bin/terminfo.mjs --version
          OUT="$RUNNER_TEMP/measurement-artifacts"
          cp bun.lock "$OUT/collector-bun.lock"
          cp packages/terminfo.dev/dist/terminfo.bundle.receipt.json "$OUT/collector-build.json"
          cp packages/terminfo.dev/dist/terminfo.bundle.mjs "$OUT/collector-bundle.mjs"

      - name: Install this job's terminal
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          case "$APP_ID" in
            windows-terminal)
              WT_DIR="$RUNNER_TEMP/windows-terminal"
              WT_ZIP="$RUNNER_TEMP/measurement-artifacts/wt.zip"
              if [ -e "$WT_DIR" ]; then
                echo "Target directory $WT_DIR already exists; refusing reuse" >&2
                exit 1
              fi
              curl -L -s -f "https://github.com/microsoft/terminal/releases/download/v1.21.2361.0/Microsoft.WindowsTerminal_1.21.2361.0_x64.zip" -o "$WT_ZIP"
              powershell -NoProfile -Command "Expand-Archive -Path '$WT_ZIP' -DestinationPath '$RUNNER_TEMP/wt_unpacked' -Force"
              mkdir -p "$WT_DIR"
              cp -r "$RUNNER_TEMP"/wt_unpacked/terminal-*/* "$WT_DIR/"
              touch "$WT_DIR/.portable"
              mkdir -p "$WT_DIR/settings"
              printf '%s\n' '{"$schema":"https://aka.ms/terminal-profiles-schema","profiles":{"defaults":{"closeOnExit":"always"}}}' > "$WT_DIR/settings/settings.json"
              test -f "$WT_DIR/WindowsTerminal.exe" || { echo "Windows Terminal binary missing at $WT_DIR/WindowsTerminal.exe" >&2; exit 1; }
              ;;
            alacritty)
              ALACRITTY_DIR="$RUNNER_TEMP/alacritty"
              ALACRITTY_ARTIFACT="$RUNNER_TEMP/measurement-artifacts/Alacritty-v0.15.1-portable.exe"
              ALACRITTY_EXPECTED_SHA256="65bbbecec3dcadca5fbcd7afcaaa83fedcb2b8febfbcdac8ac2cdbbef55b330c"
              # Pinned Mesa3D Windows x64 llvmpipe software OpenGL 3.3+ rasterizer (mmozeiko/build-mesa 26.2.5)
              # for headless windows-latest runners where Microsoft GDI Generic reports OpenGL 1.1.0 (C1 ruling 272cf5fc).
              MESA_UPSTREAM="https://github.com/mmozeiko/build-mesa"
              MESA_VERSION="26.2.5"
              MESA_ARCHIVE="$RUNNER_TEMP/measurement-artifacts/mesa-llvmpipe-x64-26.2.5.7z"
              MESA_EXPECTED_ARCHIVE_SHA256="d1b713ca2a7fba47a50c058099f13c435ddb76a16a422c334e4d787f9755a31d"
              MESA_EXPECTED_OPENGL32_SHA256="8ddc061ee752fff06ae682de0ac2e010926d76a93c1aecc4c206adee771856e1"
              if [ -e "$ALACRITTY_DIR" ]; then
                echo "Target directory $ALACRITTY_DIR already exists; refusing reuse" >&2
                exit 1
              fi
              curl -L -s -f "https://github.com/alacritty/alacritty/releases/download/v0.15.1/Alacritty-v0.15.1-portable.exe" -o "$ALACRITTY_ARTIFACT"
              ALACRITTY_ACTUAL_SHA256="$(sha256sum "$ALACRITTY_ARTIFACT" | awk '{print $1}')"
              echo "alacritty portable exe sha256: $ALACRITTY_ACTUAL_SHA256 ($ALACRITTY_ARTIFACT)"
              test "$ALACRITTY_ACTUAL_SHA256" = "$ALACRITTY_EXPECTED_SHA256" || {
                echo "Alacritty portable exe sha256 mismatch: expected $ALACRITTY_EXPECTED_SHA256, got $ALACRITTY_ACTUAL_SHA256" >&2
                exit 1
              }
              curl -L -s -f "$MESA_UPSTREAM/releases/download/$MESA_VERSION/mesa-llvmpipe-x64-$MESA_VERSION.7z" -o "$MESA_ARCHIVE"
              MESA_ACTUAL_ARCHIVE_SHA256="$(sha256sum "$MESA_ARCHIVE" | awk '{print $1}')"
              echo "Mesa3D archive ($MESA_UPSTREAM $MESA_VERSION) sha256: $MESA_ACTUAL_ARCHIVE_SHA256 ($MESA_ARCHIVE)"
              test "$MESA_ACTUAL_ARCHIVE_SHA256" = "$MESA_EXPECTED_ARCHIVE_SHA256" || {
                echo "Mesa3D archive sha256 mismatch: expected $MESA_EXPECTED_ARCHIVE_SHA256, got $MESA_ACTUAL_ARCHIVE_SHA256" >&2
                exit 1
              }
              mkdir -p "$ALACRITTY_DIR" "$RUNNER_TEMP/mesa_unpacked"
              7z x "$MESA_ARCHIVE" -o"$RUNNER_TEMP/mesa_unpacked" -y >/dev/null
              cp "$ALACRITTY_ARTIFACT" "$ALACRITTY_DIR/alacritty.exe"
              cp "$RUNNER_TEMP"/mesa_unpacked/*.dll "$ALACRITTY_DIR/"
              for dll in "$ALACRITTY_DIR"/*.dll; do
                dll_sha="$(sha256sum "$dll" | awk '{print $1}')"
                echo "Mesa3D DLL $(basename "$dll") sha256: $dll_sha ($dll)"
              done
              OPENGL32_ACTUAL_SHA256="$(sha256sum "$ALACRITTY_DIR/opengl32.dll" | awk '{print $1}')"
              test "$OPENGL32_ACTUAL_SHA256" = "$MESA_EXPECTED_OPENGL32_SHA256" || {
                echo "Mesa3D opengl32.dll sha256 mismatch: expected $MESA_EXPECTED_OPENGL32_SHA256, got $OPENGL32_ACTUAL_SHA256" >&2
                exit 1
              }
              cat > "$ALACRITTY_DIR/alacritty.toml" <<'TOML'
          [window]
          dimensions = { columns = 100, lines = 35 }
          TOML
              test -f "$ALACRITTY_DIR/alacritty.exe" || { echo "Alacritty binary missing at $ALACRITTY_DIR/alacritty.exe" >&2; exit 1; }
              ;;
            *) echo "Unknown Windows measurement app: $APP_ID" >&2; exit 1 ;;
          esac

      - name: Launch, emit the receipt, and collect as the last mutating step
        id: collect
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/measurement-artifacts"
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          COMMAND_PATH="$RUNNER_TEMP/collect.ps1"

          WIN_OUT="$(cygpath -w "$OUT")"
          WIN_COMMAND="$(cygpath -w "$COMMAND_PATH")"
          NODE_DIR="$(cygpath -w "$(dirname "$(command -v node)")")"
          BUN_DIR="$(cygpath -w "$(dirname "$(command -v bun)")")"
          COLLECTOR_BUN="$(cygpath -w "$(command -v bun)")"
          COLLECTOR="$(cygpath -w "$GITHUB_WORKSPACE/packages/terminfo.dev/bin/terminfo.mjs")"
          case "$APP_ID" in
            windows-terminal)
              APP_DIR="$(cygpath -w "$RUNNER_TEMP/windows-terminal")"
              WIN_EXECUTABLE="$(cygpath -w "$RUNNER_TEMP/windows-terminal/WindowsTerminal.exe")"
              WIN_SOURCE_ARTIFACT="$(cygpath -w "$OUT/wt.zip")"
              ;;
            alacritty)
              APP_DIR="$(cygpath -w "$RUNNER_TEMP/alacritty")"
              WIN_EXECUTABLE="$(cygpath -w "$RUNNER_TEMP/alacritty/alacritty.exe")"
              WIN_SOURCE_ARTIFACT="$(cygpath -w "$OUT/Alacritty-v0.15.1-portable.exe")"
              export MESA_UPSTREAM="https://github.com/mmozeiko/build-mesa"
              export MESA_VERSION="26.2.5"
              export MESA_ARCHIVE_PATH="$(cygpath -w "$OUT/mesa-llvmpipe-x64-26.2.5.7z")"
              ;;
            *) echo "Unknown Windows collection app: $APP_ID" >&2; exit 1 ;;
          esac

          cat > "$COMMAND_PATH" <<PS1
          \$ErrorActionPreference = "Continue"
          \$env:PATH = "$APP_DIR;$BUN_DIR;$NODE_DIR;" + \$env:PATH
          \$env:TERMINFO_DISPOSABLE_RECEIPT = "$WIN_OUT\\host-measured.json"
          \$env:TERMINFO_CAPTURE_DIRECTORY = "$WIN_OUT\\artifacts"

          \$attempts = 0
          while (-not (Test-Path "$WIN_OUT\\collector-ready")) {
            \$attempts++
            if (\$attempts -ge 180) {
              Set-Content -Path "$WIN_OUT\\collector.log" -Value "Receipt self-parse never succeeded; collection refused"
              Set-Content -Path "$WIN_OUT\\collector-exit" -Value "1"
              exit 1
            }
            Start-Sleep -Seconds 1
          }

          # The owned terminal reads TERMINFO_RUN_ID and refuses an empty launch id (owned-terminal.ts).
          # The id only exists once the launched step emitted the receipt, so it is read here, after the
          # readiness wait and before the collector (27917: hosted runs never set it).
          \$receipt = Get-Content -Raw "$WIN_OUT\\host-measured.json" | ConvertFrom-Json
          if (\$receipt.appLaunch.platform -cne "win32" -or [string]::IsNullOrWhiteSpace(\$receipt.appLaunch.productVersion) -or \$receipt.appLaunch.executablePath -ine "$WIN_EXECUTABLE") {
            Set-Content -Path "$WIN_OUT\\collector.log" -Value "Receipt lacks the measured launched executable path or ProductVersion; collection refused"
            Set-Content -Path "$WIN_OUT\\collector-exit" -Value "1"
            exit 1
          }
          \$env:TERMINFO_TARGET_VERSION = \$receipt.appLaunch.productVersion
          \$env:TERMINFO_RUN_ID = \$receipt.runId
          if ([string]::IsNullOrWhiteSpace(\$env:TERMINFO_RUN_ID)) {
            Set-Content -Path "$WIN_OUT\\collector.log" -Value "Receipt has no launch run ID; collection refused"
            Set-Content -Path "$WIN_OUT\\collector-exit" -Value "1"
            exit 1
          }

          & "$COLLECTOR_BUN" "$COLLECTOR" test --output "$WIN_OUT\\run.json" *>&1 | Out-File -FilePath "$WIN_OUT\\collector.log" -Encoding utf8
          \$exitCode = \$LASTEXITCODE
          if (\$null -eq \$exitCode) { \$exitCode = 0 }
          Set-Content -Path "$WIN_OUT\\collector-exit" -Value \$exitCode -Encoding ascii
          exit \$exitCode
          PS1

          case "$APP_ID" in
            windows-terminal)
              "$RUNNER_TEMP/windows-terminal/WindowsTerminal.exe" -d "$WIN_OUT" powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$WIN_COMMAND" > "$OUT/launcher.log" 2>&1 &
              ;;
            alacritty)
              WIN_CONFIG="$(cygpath -w "$RUNNER_TEMP/alacritty/alacritty.toml")"
              WGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe "$RUNNER_TEMP/alacritty/alacritty.exe" -v --config-file "$WIN_CONFIG" --working-directory "$WIN_OUT" --command powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$WIN_COMMAND" > "$OUT/launcher.log" 2>&1 &
              ;;
            *) echo "Unknown Windows collection app: $APP_ID" >&2; exit 1 ;;
          esac

          sleep 3
          export APP_EXECUTABLE="$WIN_EXECUTABLE" APP_SOURCE_ARTIFACT="$WIN_SOURCE_ARTIFACT"
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" emit "$OUT/job-start.json" "$OUT/host-measured.json"
          touch "$OUT/collector-ready"

          for attempt in {1..300}; do
            if [ -f "$OUT/collector-exit" ]; then
              status="$(cat "$OUT/collector-exit" | tr -d '\r\n ')"
              test "$status" = 0 || { echo "$APP_ID collector failed ($status); see collector.log artifact" >&2; exit 1; }
              test -s "$OUT/run.json" || { echo "$APP_ID collector returned no run.json" >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "$APP_ID collector did not finish within 300 seconds; see launcher/collector artifacts" >&2
          exit 1

      - name: Upload the receipt beside the exact collected run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-artifacts
          if-no-files-found: error
