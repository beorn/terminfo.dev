name: windows-measurement

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-windows:
    name: Windows ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-terminal
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the pinned producer and sample at job start
        run: |
          set -euo pipefail
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          OUT="$RUNNER_TEMP/measurement-artifacts"
          # The ONE app-launch parser is fetched beside the two receipt files so the bootstrap
          # shares exactly the parser run-parser validates with; a second copy is the drift this
          # extraction exists to prevent (28216).
          mkdir -p "$APPARATUS/scripts" "$APPARATUS/packages/terminfo.dev/src" "$APPARATUS/packages/run-parser/src" "$OUT"
          for source in scripts/hosted-runner-receipt.ts packages/terminfo.dev/src/disposable-receipt.ts packages/run-parser/src/app-launch.ts; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              --output "$APPARATUS/$source" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source?ref=$GITHUB_SHA"
          done
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" start "$OUT/job-start.json"

      - name: Configure git to preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build and install the current collector
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main || true
          bun install
          bun scripts/build-cli.ts
          npm install -g ./packages/terminfo.dev
          terminfo --version

      - name: Install this job's terminal
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          case "$APP_ID" in
            windows-terminal)
              WT_DIR="$RUNNER_TEMP/windows-terminal"
              if [ -e "$WT_DIR" ]; then
                echo "Target directory $WT_DIR already exists; refusing reuse" >&2
                exit 1
              fi
              curl -L -s -f "https://github.com/microsoft/terminal/releases/download/v1.21.2361.0/Microsoft.WindowsTerminal_1.21.2361.0_x64.zip" -o "$RUNNER_TEMP/wt.zip"
              powershell -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/wt.zip' -DestinationPath '$RUNNER_TEMP/wt_unpacked' -Force"
              mkdir -p "$WT_DIR"
              cp -r "$RUNNER_TEMP"/wt_unpacked/terminal-*/* "$WT_DIR/"
              touch "$WT_DIR/.portable"
              mkdir -p "$WT_DIR/settings"
              printf '%s\n' '{"$schema":"https://aka.ms/terminal-profiles-schema","profiles":{"defaults":{"closeOnExit":"always"}}}' > "$WT_DIR/settings/settings.json"
              test -f "$WT_DIR/wt.exe" || { echo "Windows Terminal binary missing at $WT_DIR/wt.exe" >&2; exit 1; }
              ;;
            *) echo "Unknown Windows measurement app: $APP_ID" >&2; exit 1 ;;
          esac

      - name: Launch, emit the receipt, and collect as the last mutating step
        id: collect
        env:
          APP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/measurement-artifacts"
          APPARATUS="$RUNNER_TEMP/hosted-apparatus"
          COMMAND_PATH="$RUNNER_TEMP/collect.ps1"

          WIN_OUT="$(cygpath -w "$OUT")"
          WIN_COMMAND="$(cygpath -w "$COMMAND_PATH")"
          NODE_DIR="$(cygpath -w "$(dirname "$(command -v node)")")"
          TERMINFO_DIR="$(cygpath -w "$(dirname "$(command -v terminfo)")")"
          WT_DIR="$(cygpath -w "$RUNNER_TEMP/windows-terminal")"

          cat > "$COMMAND_PATH" <<PS1
          \$ErrorActionPreference = "Continue"
          \$env:PATH = "$WT_DIR;$NODE_DIR;$TERMINFO_DIR;" + \$env:PATH
          \$env:TERMINFO_TARGET_VERSION = "1.21.2361.0"
          \$env:TERMINFO_DISPOSABLE_RECEIPT = "$WIN_OUT\\host-measured.json"

          \$attempts = 0
          while (-not (Test-Path "$WIN_OUT\\collector-ready")) {
            \$attempts++
            if (\$attempts -ge 180) {
              Set-Content -Path "$WIN_OUT\\collector.log" -Value "Receipt self-parse never succeeded; collection refused"
              Set-Content -Path "$WIN_OUT\\collector-exit" -Value "1"
              exit 1
            }
            Start-Sleep -Seconds 1
          }

          & terminfo test --output "$WIN_OUT\\run.json" *>&1 | Out-File -FilePath "$WIN_OUT\\collector.log" -Encoding utf8
          \$exitCode = \$LASTEXITCODE
          if (\$null -eq \$exitCode) { \$exitCode = 0 }
          Set-Content -Path "$WIN_OUT\\collector-exit" -Value \$exitCode -Encoding ascii
          exit \$exitCode
          PS1

          case "$APP_ID" in
            windows-terminal)
              "$RUNNER_TEMP/windows-terminal/wt.exe" -d "$WIN_OUT" powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$WIN_COMMAND" > "$OUT/launcher.log" 2>&1 &
              ;;
            *) echo "Unknown Windows collection app: $APP_ID" >&2; exit 1 ;;
          esac

          sleep 3
          node --experimental-strip-types "$APPARATUS/scripts/hosted-runner-receipt.ts" emit "$OUT/job-start.json" "$OUT/host-measured.json"
          touch "$OUT/collector-ready"

          for attempt in {1..300}; do
            if [ -f "$OUT/collector-exit" ]; then
              status="$(cat "$OUT/collector-exit" | tr -d '\r\n ')"
              test "$status" = 0 || { echo "$APP_ID collector failed ($status); see collector.log artifact" >&2; exit 1; }
              test -s "$OUT/run.json" || { echo "$APP_ID collector returned no run.json" >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "$APP_ID collector did not finish within 300 seconds; see launcher/collector artifacts" >&2
          exit 1

      - name: Upload the receipt beside the exact collected run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-artifacts
          if-no-files-found: error
