      - name: Upload identity samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-identity-sample-${{ matrix.sample }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-identity
          if-no-files-found: error
