name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  # Deploy gate: content validation + build + 404 sweep must pass before
  # anything reaches Cloudflare. Previously deploy ran ungated, so a bad
  # commit went live immediately and the weekly validate workflow only
  # flagged it after the fact.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Validate content
        run: bun run validate

      - name: Build site
        run: bun run build

      - name: Check for 404s
        run: bun scripts/check-404s.ts

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx --bun vitepress build docs

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3fea5563acad414fa36c40d5c440368f
          command: pages deploy docs/.vitepress/dist --project-name terminfo-dev
