name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  # Deploy gate: content validation + build + private-leak scan + 404 sweep
  # must pass before anything reaches Cloudflare. Previously deploy ran ungated,
  # so a bad commit went live immediately and the weekly validate workflow only
  # flagged it after the fact. The private-leak scan exists because internal AI
  # reviews once shipped as live /reviews/ routes on this public site.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site-sha256: ${{ steps.archive.outputs.sha256 }}
      site-artifact-name: ${{ steps.archive.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Validate content
        run: bun run validate

      - name: Run unit tests
        run: bun vitest run

      - name: Build site
        run: bun run build

      - name: Check for private-content leak
        run: bun scripts/check-private-leak.ts

      - name: Check for 404s
        run: bun scripts/check-404s.ts

      - name: Archive the validated site
        id: archive
        shell: bash
        run: |
          tar -C docs/.vitepress/dist -czf site.tar.gz .
          digest=$(sha256sum site.tar.gz | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "artifact-name=validated-site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Validated site SHA-256: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: site.tar.gz
          if-no-files-found: error

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.validate.outputs.site-artifact-name }}

      - name: Verify and unpack the validated site
        shell: bash
        env:
          EXPECTED_SITE_SHA256: ${{ needs.validate.outputs.site-sha256 }}
        run: |
          printf '%s  site.tar.gz\n' "$EXPECTED_SITE_SHA256" | sha256sum --check --strict
          mkdir -p docs/.vitepress/dist
          tar -xzf site.tar.gz -C docs/.vitepress/dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3fea5563acad414fa36c40d5c440368f
          command: pages deploy docs/.vitepress/dist --project-name terminfo-dev

      - name: Verify live build identity
        shell: bash
        run: |
          set -euo pipefail
          readback_file=$(mktemp)
          trap 'rm -f "$readback_file"' EXIT
          curl --fail --show-error --silent --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://terminfo.dev/api/v1/build.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o "$readback_file"
          python3 - "$readback_file" <<'PY'
          import json, os, sys
          try:
              with open("docs/.vitepress/dist/api/v1/build.json") as archive:
                  expected = json.load(archive)
              with open(sys.argv[1]) as response:
                  actual = json.load(response)
              if (expected["sourceCommit"] != os.environ["GITHUB_SHA"]
                      or expected["githubRun"]["id"] != os.environ["GITHUB_RUN_ID"]
                      or expected["dirty"] is not False or expected["context"] != "github"):
                  raise ValueError("Validated archive is not this clean GitHub build")
              if json.dumps(actual, sort_keys=True) != json.dumps(expected, sort_keys=True):
                  raise ValueError("Live build identity differs from validated archive")
          except (OSError, ValueError, KeyError, TypeError) as error:
              sys.exit(f"Cannot verify live build identity: {error}")
          print("Verified live build identity against validated archive and GitHub run")
          PY
