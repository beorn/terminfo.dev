name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  # 27896: production publish is operator-GO only. GitHub still lets
  # workflow_dispatch pick any branch that contains this file; this job fails
  # loud so a dispatch on main (or any other ref) cannot reach Cloudflare.
  # The `production` environment on the deploy job is the second lock: it does
  # not exist as a required-reviewer gate until the operator applies the
  # GitHub settings on the bead checklist.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse every ref except live
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/live" ]; then
            echo "::error::terminfo.dev deploy refuses ${GITHUB_REF}; only refs/heads/live may publish (27896)"
            exit 1
          fi

  # Deploy gate: content validation + build + private-leak scan + 404 sweep
  # must pass before anything reaches Cloudflare. Previously deploy ran ungated,
  # so a bad commit went live immediately and the weekly validate workflow only
  # flagged it after the fact. The private-leak scan exists because internal AI
  # reviews once shipped as live /reviews/ routes on this public site.
  validate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site-sha256: ${{ steps.archive.outputs.sha256 }}
      site-artifact-name: ${{ steps.archive.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/source-siblings

      - name: Validate content
        run: bun run validate

      - name: Build site
        run: bun run build

      - name: Check for private-content leak
        run: bun scripts/check-private-leak.ts

      - name: Check for 404s
        run: bun scripts/check-404s.ts

      - name: Archive the validated site
        id: archive
        shell: bash
        run: |
          tar -C docs/.vitepress/dist -czf site.tar.gz .
          digest=$(sha256sum site.tar.gz | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "artifact-name=validated-site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Validated site SHA-256: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: site.tar.gz
          if-no-files-found: error

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://terminfo.dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.validate.outputs.site-artifact-name }}

      - name: Verify and unpack the validated site
        shell: bash
        env:
          EXPECTED_SITE_SHA256: ${{ needs.validate.outputs.site-sha256 }}
        run: |
          printf '%s  site.tar.gz\n' "$EXPECTED_SITE_SHA256" | sha256sum --check --strict
          mkdir -p docs/.vitepress/dist
          tar -xzf site.tar.gz -C docs/.vitepress/dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3fea5563acad414fa36c40d5c440368f
          command: pages deploy docs/.vitepress/dist --project-name terminfo-dev --branch main

      - name: Verify live build identity
        shell: bash
        run: |
          set -euo pipefail
          # Pages switches the production domain over seconds after Wrangler returns: run 44865328154 read 404
          # 0.26 s after "Deployment complete", and a later release reads the previous build's build.json. The
          # compare is unchanged and only an identical read passes; a 404 or another build waits for the next
          # cache-busting try, and the window ends loudly (#37315, @cto 5c47f401).
          tries=18
          interval=10
          readback_file=$(mktemp)
          compare_script=$(mktemp)
          trap 'rm -f "$readback_file" "$compare_script"' EXIT
          cat > "$compare_script" <<'PY'
          import json, os, sys
          try:
              with open("docs/.vitepress/dist/build.json") as archive:
                  expected = json.load(archive)
              if (expected["sourceCommit"] != os.environ["GITHUB_SHA"]
                      or expected["githubRun"]["id"] != os.environ["GITHUB_RUN_ID"]
                      or expected["dirty"] is not False or expected["context"] != "github"):
                  raise ValueError("Validated archive is not this clean GitHub build")
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"Cannot verify live build identity: {error}")
              sys.exit(2)
          if sys.argv[2] != "200":
              print("not matched")
              sys.exit(1)
          try:
              with open(sys.argv[1]) as response:
                  actual = json.load(response)
          except (OSError, ValueError) as error:
              print(f"not matched: the response is not build.json ({error.__class__.__name__})")
              sys.exit(1)
          if json.dumps(actual, sort_keys=True) != json.dumps(expected, sort_keys=True):
              print("not matched: live build identity differs from validated archive")
              sys.exit(1)
          print("matched")
          PY
          status=none
          for try in $(seq 1 "$tries"); do
            : > "$readback_file"
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' -o "$readback_file" -w '%{http_code}' \
              "https://terminfo.dev/build.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$try") || status="curl exit $?"
            verdict=0
            reason=$(python3 "$compare_script" "$readback_file" "$status") || verdict=$?
            echo "try $try/$tries: HTTP $status, $reason"
            if [ "$verdict" -eq 0 ]; then
              echo "Verified live build identity against validated archive and GitHub run"
              exit 0
            fi
            if [ "$verdict" -eq 2 ]; then
              exit 1
            fi
            if [ "$try" -lt "$tries" ]; then
              sleep "$interval"
            fi
          done
          body_hash=$(sha256sum "$readback_file" | cut -d' ' -f1)
          echo "::error::Cannot verify live build identity after $tries tries $interval s apart: last HTTP $status, body sha256 $body_hash, expected sourceCommit $GITHUB_SHA"
          exit 1
