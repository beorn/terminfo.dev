name: windows-terminal-cli-27494

on:
  push:
    branches:
      - task/windows-terminal-cli-27494
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cli-run:
    name: windows-terminal-cli-run
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sample VM identity at job start
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\artifacts | Out-Null
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          function Sha256String($str) {
            if (-not $str) { return "" }
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($str)
            $hash = $hasher.ComputeHash($bytes)
            return -join ($hash | ForEach-Object { "{0:x2}" -f $_ })
          }
          $mId = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Cryptography" -Name MachineGuid -ErrorAction SilentlyContinue).MachineGuid
          $pUuid = (Get-CimInstance Win32_ComputerSystemProduct -ErrorAction SilentlyContinue).UUID
          $bootTime = (Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue).LastBootUpTime.ToString("o")
          $id = @{
            machineIdSha256 = Sha256String $mId
            productUuidSha256 = Sha256String $pUuid
            bootIdSha256 = Sha256String $bootTime
          }
          $id | ConvertTo-Json | Out-File "C:\artifacts\identity_job_start.json" -Encoding utf8
          Write-Output "Sampled identity at job start:"
          $id | ConvertTo-Json

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Gather system, display, and session context
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path C:\artifacts | Out-Null
          $logPath = "C:\artifacts\context.txt"

          function Log($msg) {
            Write-Output $msg
            $msg | Out-File -Append -FilePath $logPath -Encoding utf8
          }

          Log "=== WINDOWS OS / BUILD ==="
          $os = Get-CimInstance Win32_OperatingSystem
          Log "Caption: $($os.Caption)"
          Log "Version: $($os.Version)"
          Log "BuildNumber: $($os.BuildNumber)"
          Log "OSArchitecture: $($os.OSArchitecture)"

          Log "`n=== RUNNER ENVIRONMENT ==="
          Log "ImageOS: $env:ImageOS"
          Log "ImageVersion: $env:ImageVersion"
          Log "RUNNER_ARCH: $env:RUNNER_ARCH"
          Log "RUNNER_OS: $env:RUNNER_OS"
          Log "User: $env:USERNAME"
          Log "UserDomain: $env:USERDOMAIN"

          Log "`n=== TOOLCHAIN VERSIONS ==="
          Log "Node: $(node -v)"
          Log "NPM: $(npm -v)"
          Log "NPX: $(npx -v)"
          try { Log "Bun: $(bun -v)" } catch { Log "Bun not found" }

          Log "`n=== SESSION & INTERACTIVE STATUS ==="
          Log "Process SessionId: $((Get-Process -Id $PID).SessionId)"
          Log "Environment.UserInteractive: $([System.Environment]::UserInteractive)"
          try {
            $sessions = qwinsta 2>&1
            Log "qwinsta output:`n$($sessions -join "`n")"
          } catch {
            Log "qwinsta failed: $_"
          }

          Log "`n=== DISPLAY & GRAPHICS ==="
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $screens = [System.Windows.Forms.Screen]::AllScreens
            Log "Screen count: $($screens.Count)"
            foreach ($s in $screens) {
              Log "Screen: DeviceName=$($s.DeviceName), Bounds=$($s.Bounds.Width)x$($s.Bounds.Height), Primary=$($s.Primary), BitsPerPixel=$($s.BitsPerPixel)"
            }
          } catch {
            Log "System.Windows.Forms Screen query failed: $_"
          }

      - name: Locate or Install Windows Terminal
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $logPath = "C:\artifacts\context.txt"
          function Log($msg) {
            Write-Output $msg
            $msg | Out-File -Append -FilePath $logPath -Encoding utf8
          }

          Log "`n=== LOCATING WINDOWS TERMINAL ==="

          $cmd = Get-Command wt.exe -ErrorAction SilentlyContinue
          $wtPath = if ($cmd) { $cmd.Source } else { $null }

          if (-not $wtPath) {
            $localAppWt = "$env:LOCALAPPDATA\Microsoft\WindowsApps\wt.exe"
            if (Test-Path $localAppWt) { $wtPath = $localAppWt }
          }

          if (-not $wtPath) {
            $sysWt = "C:\Users\runneradmin\AppData\Local\Microsoft\WindowsApps\wt.exe"
            if (Test-Path $sysWt) { $wtPath = $sysWt }
          }

          if (-not $wtPath) {
            $appDir = Get-ChildItem "C:\Program Files\WindowsApps" -Filter "wt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($appDir) { $wtPath = $appDir.FullName }
          }

          if (-not $wtPath) {
            Log "Attempting standalone zip download for Windows Terminal..."
            try {
              $wtZip = "C:\wt.zip"
              $wtDir = "C:\WindowsTerminal"
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri "https://github.com/microsoft/terminal/releases/download/v1.21.2361.0/Microsoft.WindowsTerminal_1.21.2361.0_x64.zip" -OutFile $wtZip -UseBasicParsing
              Expand-Archive -Path $wtZip -DestinationPath $wtDir -Force
              if (Test-Path "$wtDir\wt.exe") {
                $wtPath = "$wtDir\wt.exe"
              }
            } catch {
              Log "Download standalone Windows Terminal failed: $_"
            }
          }

          if ($wtPath) {
            Log "Windows Terminal resolved at: $wtPath"
            try {
              $wtVer = (Get-Item $wtPath).VersionInfo.ProductVersion
              Log "Windows Terminal ProductVersion: $wtVer"
            } catch {}
            [Environment]::SetEnvironmentVariable("WT_BIN", $wtPath, "Machine")
            $env:WT_BIN = $wtPath
          } else {
            Log "ERROR: Windows Terminal could not be installed or resolved."
          }

      - name: Build and install local terminfo CLI
        shell: powershell
        run: |
          bun install --frozen-lockfile
          cd packages\terminfo.dev
          bun run build
          npm pack
          $pkg = (Get-ChildItem terminfo.dev-*.tgz | Select-Object -First 1).FullName
          npm install -g $pkg
          Write-Output "Installed terminfo CLI globally from $pkg"

      - name: Generate disposable ownership receipt
        shell: powershell
        run: |
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          function Sha256String($str) {
            if (-not $str) { return "" }
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($str)
            $hash = $hasher.ComputeHash($bytes)
            return -join ($hash | ForEach-Object { "{0:x2}" -f $_ })
          }
          $mId = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Cryptography" -Name MachineGuid -ErrorAction SilentlyContinue).MachineGuid
          $pUuid = (Get-CimInstance Win32_ComputerSystemProduct -ErrorAction SilentlyContinue).UUID
          $bootTime = (Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue).LastBootUpTime.ToString("o")
          $idAtCollection = @{
            machineIdSha256 = Sha256String $mId
            productUuidSha256 = Sha256String $pUuid
            bootIdSha256 = Sha256String $bootTime
          }
          $idAtStart = Get-Content "C:\artifacts\identity_job_start.json" -Raw | ConvertFrom-Json
          $collectedAt = [DateTime]::UtcNow.ToString("o")
          $runId = ([Guid]::NewGuid().ToString("N"))

          $receipt = @{
            schemaVersion = 1
            kind = "github-hosted-runner"
            runId = $runId
            collectedAt = $collectedAt
            job = @{
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW
              workflowRef = $env:GITHUB_WORKFLOW_REF
              githubRunId = $env:GITHUB_RUN_ID
              githubRunAttempt = $env:GITHUB_RUN_ATTEMPT
              job = $env:GITHUB_JOB
              jobId = $env:GITHUB_JOB
            }
            runner = @{
              environment = $env:RUNNER_ENVIRONMENT
              name = $env:RUNNER_NAME
              os = $env:RUNNER_OS
              arch = $env:RUNNER_ARCH
              imageOS = $env:ImageOS
              imageVersion = $env:ImageVersion
              trackingId = $env:RUNNER_TRACKING_ID
            }
            vm = @{
              identityAtJobStart = @{
                machineIdSha256 = $idAtStart.machineIdSha256
                productUuidSha256 = $idAtStart.productUuidSha256
                bootIdSha256 = $idAtStart.bootIdSha256
              }
              identityAtCollection = $idAtCollection
            }
          }
          $receiptJson = $receipt | ConvertTo-Json -Depth 5
          $receiptJson | Out-File "C:\artifacts\disposable-receipt.json" -Encoding utf8
          Write-Output "Generated disposable-ownership receipt at C:\artifacts\disposable-receipt.json:"
          Write-Output $receiptJson
          [Environment]::SetEnvironmentVariable("TERMINFO_DISPOSABLE_RECEIPT", "C:\artifacts\disposable-receipt.json", "Machine")
          [Environment]::SetEnvironmentVariable("TERMINFO_RECEIPT_PATH", "C:\artifacts\disposable-receipt.json", "Machine")

      - name: Run terminfo.dev CLI inside Windows Terminal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "=== Starting Windows Terminal Probe Run ==="

          # Write runner Python script
          @'
          import ctypes
          import os
          import shutil
          import subprocess
          import sys
          import time

          kernel32 = ctypes.windll.kernel32
          try:
              hOut = kernel32.GetStdHandle(-11)
              mode = ctypes.c_ulong()
              kernel32.GetConsoleMode(hOut, ctypes.byref(mode))
              kernel32.SetConsoleMode(hOut, mode.value | 0x0004) # ENABLE_VIRTUAL_TERMINAL_PROCESSING
          except Exception:
              pass

          try:
              hIn = kernel32.GetStdHandle(-10)
              in_mode = ctypes.c_ulong()
              kernel32.GetConsoleMode(hIn, ctypes.byref(in_mode))
              kernel32.SetConsoleMode(hIn, in_mode.value | 0x0200) # ENABLE_VIRTUAL_TERMINAL_INPUT
          except Exception:
              pass

          artifacts_dir = r"C:\artifacts"
          os.makedirs(artifacts_dir, exist_ok=True)
          log_file = os.path.join(artifacts_dir, "terminal-output.txt")
          raw_json = os.path.join(artifacts_dir, "terminfo-run.json")
          screen_dump = os.path.join(artifacts_dir, "terminal-full-screen.txt")

          def log(msg):
              sys.stdout.write(msg + "\r\n")
              sys.stdout.flush()
              with open(log_file, "a", encoding="utf-8") as f:
                  f.write(msg + "\n")

          def dump_screen(path):
              try:
                  hOut = kernel32.GetStdHandle(-11)
                  class COORD(ctypes.Structure):
                      _fields_ = [("X", ctypes.c_short), ("Y", ctypes.c_short)]
                  class SMALL_RECT(ctypes.Structure):
                      _fields_ = [("Left", ctypes.c_short), ("Top", ctypes.c_short), ("Right", ctypes.c_short), ("Bottom", ctypes.c_short)]
                  class CONSOLE_SCREEN_BUFFER_INFO(ctypes.Structure):
                      _fields_ = [("dwSize", COORD), ("dwCursorPosition", COORD), ("wAttributes", ctypes.c_ushort),
                                  ("srWindow", SMALL_RECT), ("dwMaximumWindowSize", COORD)]
                  csbi = CONSOLE_SCREEN_BUFFER_INFO()
                  kernel32.GetConsoleScreenBufferInfo(hOut, ctypes.byref(csbi))
                  width = csbi.dwSize.X
                  height = max(csbi.dwCursorPosition.Y + 1, csbi.srWindow.Bottom + 1)
                  num_chars = width * height
                  buf = ctypes.create_unicode_buffer(num_chars)
                  read = ctypes.c_ulong()
                  origin = COORD(0, 0)
                  kernel32.ReadConsoleOutputCharacterW(hOut, buf, num_chars, origin, ctypes.byref(read))
                  lines = [buf.value[i * width : (i + 1) * width].rstrip() for i in range(height)]
                  with open(path, "w", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")
              except Exception as e:
                  with open(path, "a", encoding="utf-8") as f:
                      f.write(f"dump_screen error: {e}\n")

          sys.stdout.write("\033[2J\033[H\r\n")
          sys.stdout.write("  \033[1;36m====================================================\033[0m\r\n")
          sys.stdout.write("  \033[1;36m  terminfo.dev Windows Terminal Probe Run           \033[0m\r\n")
          sys.stdout.write("  \033[1;36m====================================================\033[0m\r\n\r\n")
          sys.stdout.flush()

          log("=== RUN ENVIRONMENT ===")
          log(f"Time: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}")
          log(f"Platform: {sys.platform}")
          log(f"Python: {sys.version.split()[0]}")
          for v in ["WT_SESSION", "TERM", "COLORTERM", "TERM_PROGRAM", "TERM_PROGRAM_VERSION"]:
              log(f"env:{v} = {os.environ.get(v, '<unset>')}")

          # RUN: test with --output (direct console execution in Windows Terminal, no pipes)
          log("\n=== RUN: terminfo test --output in Windows Terminal ===")
          log(f"Command: cmd.exe /c terminfo test --output {raw_json}")
          receipt_file = os.path.join(artifacts_dir, "disposable-receipt.json")
          sub_env = dict(os.environ)
          if os.path.exists(receipt_file):
              sub_env["TERMINFO_DISPOSABLE_RECEIPT"] = receipt_file
              sub_env["TERMINFO_RECEIPT_PATH"] = receipt_file
              log(f"Receipt present: {receipt_file} ({os.path.getsize(receipt_file)} bytes)")
          t0 = time.time()
          try:
              proc1 = subprocess.run(["cmd.exe", "/c", "terminfo", "test", "--output", raw_json], timeout=120, env=sub_env)
              dur1 = time.time() - t0
              log(f"Run exit code: {proc1.returncode} in {dur1:.2f}s")
          except Exception as e:
              log(f"Run failed: {e}")

          if os.path.exists(raw_json) and os.path.getsize(raw_json) > 0:
              log(f"SUCCESS: Raw result file generated ({os.path.getsize(raw_json)} bytes)")
              dest_copy = os.path.join(artifacts_dir, "results_windows_terminal.json")
              shutil.copyfile(raw_json, dest_copy)
              log(f"Saved copy to {dest_copy}")
          else:
              log(f"NOTE: Result file {raw_json} was not generated by --output.")

          # Dump console screen buffer text
          dump_screen(screen_dump)
          log("\n=== PROBE SUITE FINISHED ===")

          with open(r"C:\artifacts\wt_finished.txt", "w") as f:
              f.write("finished\n")

          # Sleep so screenshot captures the final terminal state
          time.sleep(5)
          '@ | Out-File -FilePath "C:\run_wt_cli.py" -Encoding utf8

          $wtBin = [Environment]::GetEnvironmentVariable("WT_BIN", "Machine")
          if (-not $wtBin) { $wtBin = "C:\WindowsTerminal\wt.exe" }

          if ($wtBin -and (Test-Path $wtBin)) {
            Write-Output "Launching Windows Terminal via: $wtBin"
            $proc = Start-Process -FilePath $wtBin -ArgumentList "new-tab", "--title", "WTCLIProbe", "-d", "C:\", "cmd.exe", "/c", "python -u C:\run_wt_cli.py" -PassThru
            for ($i = 0; $i -lt 180; $i++) {
              if (Test-Path "C:\artifacts\wt_finished.txt") {
                Write-Output "WT probe run finished after $i seconds."
                break
              }
              Start-Sleep -Seconds 1
            }
            Start-Sleep -Seconds 3

            # Capture desktop screenshot
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("C:\artifacts\screenshot_wt_desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
            Write-Output "Saved screenshot_wt_desktop.png"

            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Output "WT binary not available. Running probe script directly in runner console..."
            python -u C:\run_wt_cli.py
          }

      - name: Inspect generated artifacts
        shell: powershell
        run: |
          Write-Output "=== ARTIFACTS INVENTORY ==="
          Get-ChildItem -Path C:\artifacts | Format-Table Name, Length, LastWriteTime

          if (Test-Path "C:\artifacts\terminal-output.txt") {
            Write-Output "`n=== TERMINAL OUTPUT LOG ==="
            Get-Content "C:\artifacts\terminal-output.txt"
          }

          if (Test-Path "C:\artifacts\terminal-full-screen.txt") {
            Write-Output "`n=== CONSOLE SCREEN BUFFER DUMP ==="
            Get-Content "C:\artifacts\terminal-full-screen.txt"
          }

      - name: Parse and summarize Windows Terminal probe results
        shell: bash
        run: |
          python - << 'PYEOF'
          import json
          import os

          path = "/c/artifacts/results_windows_terminal.json"
          if not os.path.exists(path):
              path = "/c/artifacts/terminfo-run.json"
          if not os.path.exists(path):
              path = r"C:\artifacts\results_windows_terminal.json"
          if not os.path.exists(path):
              path = r"C:\artifacts\terminfo-run.json"

          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
              print("\n=== WINDOWS TERMINAL RESULTS SUMMARY ===")
              print(f"Run ID: {data.get('runId')}")
              print(f"Target: {json.dumps(data.get('target', {}), indent=2)}")
              obs = data.get("observations", [])
              print(f"Total observations: {len(obs)}")
              counts = {}
              reasons = {}
              for o in obs:
                  outc = o.get("outcome", "unknown")
                  counts[outc] = counts.get(outc, 0) + 1
                  r = o.get("reason")
                  if r:
                      reasons[r] = reasons.get(r, 0) + 1
              print("Outcome counts:", json.dumps(counts, indent=2))
              print("Top reasons:", json.dumps(reasons, indent=2))
              rr = data.get("rawReplies", {})
              print("Identity replies:")
              print("  DA1:", repr(rr.get("device.primary-da")))
              print("  DA2:", repr(rr.get("device.secondary-da")))
              print("  XTVERSION:", repr(rr.get("device.xtversion")))
          else:
              print("No result file found in C:\\artifacts")
          PYEOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-cli-artifacts
          path: C:\artifacts
