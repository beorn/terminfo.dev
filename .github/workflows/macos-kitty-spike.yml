name: macos-kitty-spike

on:
  push:
    branches:
      - spike/hosted-macos-27479
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: macos-terminal-matrix-spike-job
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Gather system and display context
        continue-on-error: true
        run: |
          caffeinate -u -t 600 &
          mkdir -p /tmp/spike-artifacts
          {
            echo "=== SYSTEM VERSION ==="
            sw_vers
            echo ""
            echo "=== RUNNER INFO ==="
            echo "ImageOS: ${ImageOS:-unknown}"
            echo "ImageVersion: ${ImageVersion:-unknown}"
            echo "RUNNER_ARCH: ${RUNNER_ARCH:-unknown}"
            echo "RUNNER_OS: ${RUNNER_OS:-unknown}"
            echo ""
            echo "=== DISPLAY / GRAPHICS ==="
            system_profiler SPDisplaysDataType 2>/dev/null || true
            echo ""
            echo "=== DESKTOP BOUNDS ==="
            osascript -e 'tell application "Finder" to get bounds of window of desktop' 2>/dev/null || true
          } > /tmp/spike-artifacts/context.txt

      - name: Install terminal matrix (iTerm2, WezTerm, Ghostty via Brew; Alacritty via GitHub release)
        continue-on-error: true
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          for app in iterm2 wezterm ghostty; do
            echo "=== Installing $app ==="
            brew install --cask "$app" || echo "WARNING: Failed to install $app via brew cask"
          done

          echo "=== Installing Alacritty from GitHub Releases ==="
          curl -sL https://github.com/alacritty/alacritty/releases/download/v0.17.0/Alacritty-v0.17.0.dmg -o /tmp/Alacritty.dmg || true
          if [ -f /tmp/Alacritty.dmg ]; then
            hdiutil attach /tmp/Alacritty.dmg -mountpoint /Volumes/Alacritty || true
            cp -R /Volumes/Alacritty/Alacritty.app /Applications/ 2>/dev/null || true
            hdiutil detach /Volumes/Alacritty 2>/dev/null || true
          fi

          sudo xattr -cr /Applications/*.app 2>/dev/null || true

      - name: "Test 1 - Terminal.app (Control: DEC Special Graphics + DA1)"
        continue-on-error: true
        run: |
          echo "=== Testing Terminal.app ==="

          echo "" | base64 -d > /tmp/fixture_terminal.py

          cat << 'CMDEOF' > /tmp/run_fixture.command
          #!/bin/bash
          python3 /tmp/fixture_terminal.py
          CMDEOF
          chmod +x /tmp/run_fixture.command

          open -a /System/Applications/Utilities/Terminal.app /tmp/run_fixture.command

          sleep 2
          osascript -e 'tell application "Terminal" to set bounds of front window to {50, 50, 850, 650}' 2>/dev/null || true

          for i in {1..20}; do
            if [ -f /tmp/fixture_ready_terminal.txt ]; then
              echo "Terminal fixture ready after $i seconds."
              break
            fi
            sleep 1
          done

          sleep 2

          screencapture -x /tmp/spike-artifacts/screenshot_terminal_app.png > /tmp/spike-artifacts/screencapture_terminal.log 2>&1 || true

          osascript -e 'tell application "Terminal" to quit saving no' 2>/dev/null || killall Terminal 2>/dev/null || true
          sleep 1

      - name: Test 2 - iTerm2
        continue-on-error: true
        run: |
          echo "=== Testing iTerm2 ==="
          if [ -d "/Applications/iTerm.app" ]; then
            defaults write com.googlecode.iterm2 DisableGPUWhenUnplugged -bool true
            defaults write com.googlecode.iterm2 UseMetal -bool false
            defaults write com.googlecode.iterm2 MetalAllowed -bool false

            /Applications/iTerm.app/Contents/MacOS/iTerm2 > /tmp/spike-artifacts/iterm2.log 2>&1 &
            ITERM_PID=$!
            sleep 4

            screencapture -x /tmp/spike-artifacts/screenshot_iterm2.png > /tmp/spike-artifacts/screencapture_iterm2.log 2>&1 || true

            killall iTerm2 2>/dev/null || kill -TERM "$ITERM_PID" 2>/dev/null || true
          else
            echo "iTerm.app not found in /Applications" > /tmp/spike-artifacts/iterm2.log
          fi
          sleep 1

      - name: Test 3 - WezTerm (Software front_end)
        continue-on-error: true
        run: |
          echo "=== Testing WezTerm ==="
          if [ -d "/Applications/WezTerm.app" ]; then
            echo "bG9jYWwgd2V6dGVybSA9IHJlcXVpcmUgIndlenRlcm0iCmxvY2FsIGNvbmZpZyA9IHt9CmNvbmZpZy5mcm9udF9lbmQgPSAiU29mdHdhcmUiCmNvbmZpZy5pbml0aWFsX2NvbHMgPSA4MApjb25maWcuaW5pdGlhbF9yb3dzID0gMjQKcmV0dXJuIGNvbmZpZwo=" | base64 -d > /tmp/wezterm.lua

            WEZTERM_BIN="/Applications/WezTerm.app/Contents/MacOS/wezterm-gui"
            "$WEZTERM_BIN" --config-file /tmp/wezterm.lua start -- python3 -c "import time; print('WezTerm Software running'); time.sleep(15)" > /tmp/spike-artifacts/wezterm.log 2>&1 &
            WEZ_PID=$!
            sleep 4

            screencapture -x /tmp/spike-artifacts/screenshot_wezterm.png > /tmp/spike-artifacts/screencapture_wezterm.log 2>&1 || true

            kill -TERM "$WEZ_PID" 2>/dev/null || killall wezterm-gui 2>/dev/null || true
          else
            echo "WezTerm.app not found in /Applications" > /tmp/spike-artifacts/wezterm.log
          fi
          sleep 1

      - name: Test 4 - Alacritty
        continue-on-error: true
        run: |
          echo "=== Testing Alacritty ==="
          if [ -d "/Applications/Alacritty.app" ]; then
            ALACRITTY_BIN="/Applications/Alacritty.app/Contents/MacOS/alacritty"
            "$ALACRITTY_BIN" -e python3 -c "import time; print('Alacritty running'); time.sleep(15)" > /tmp/spike-artifacts/alacritty.log 2>&1 &
            ALAC_PID=$!
            sleep 4

            screencapture -x /tmp/spike-artifacts/screenshot_alacritty.png > /tmp/spike-artifacts/screencapture_alacritty.log 2>&1 || true

            kill -TERM "$ALAC_PID" 2>/dev/null || killall alacritty 2>/dev/null || true
          else
            echo "Alacritty.app not found in /Applications" > /tmp/spike-artifacts/alacritty.log
          fi
          sleep 1

      - name: Test 5 - Ghostty
        continue-on-error: true
        run: |
          echo "=== Testing Ghostty ==="
          if [ -d "/Applications/Ghostty.app" ]; then
            GHOSTTY_BIN="/Applications/Ghostty.app/Contents/MacOS/ghostty"
            "$GHOSTTY_BIN" -e python3 -c "import time; print('Ghostty running'); time.sleep(15)" > /tmp/spike-artifacts/ghostty.log 2>&1 &
            GHOST_PID=$!
            sleep 4

            screencapture -x /tmp/spike-artifacts/screenshot_ghostty.png > /tmp/spike-artifacts/screencapture_ghostty.log 2>&1 || true

            kill -TERM "$GHOST_PID" 2>/dev/null || killall ghostty 2>/dev/null || true
          else
            echo "Ghostty.app not found in /Applications" > /tmp/spike-artifacts/ghostty.log
          fi
          sleep 1

      - name: Report file inventory and summary
        continue-on-error: true
        run: |
          echo "=== Permissions log ==="
          log show --predicate 'subsystem == "com.apple.TCC"' --last 10m 2>/dev/null | tail -n 50 > /tmp/spike-artifacts/permissions.log || true

          echo "=== Artifacts Directory ==="
          ls -lah /tmp/spike-artifacts

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-terminal-spike-artifacts
          path: /tmp/spike-artifacts

      - name: Conclude successfully
        run: echo "Spike workflow completed."
